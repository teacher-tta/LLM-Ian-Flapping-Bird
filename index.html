<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind Archer Cookie — Forest Vine Flight</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: radial-gradient(circle at top, #134e4a, #06181a 75%);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: #ecfdf5;
      user-select: none;
    }

    .game-shell {
      position: relative;
      border-radius: 16px;
      padding: 6px;
      background: linear-gradient(135deg, #4ade80, #15803d 45%, #86efac 100%);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65), 0 0 28px rgba(74, 222, 128, 0.25);
    }

    canvas {
      display: block;
      border-radius: 12px;
      background: #0b2623;
      cursor: pointer;
    }

    .hud-bar {
      width: 420px;
      max-width: 95vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(6, 28, 28, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.35);
      font-size: 13px;
    }

    .skill-btn {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid #86efac;
      background: linear-gradient(180deg, #22c55e, #15803d);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .skill-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .skill-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .skill-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      background: linear-gradient(180deg, #334155, #1e293b);
      border-color: #64748b;
    }

    .hints {
      color: #bbf7d0;
      font-size: 12px;
      text-align: right;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
  </div>

  <div class="hud-bar">
    <button id="windArrowBtn" class="skill-btn" type="button">
      Wind Arrow Ready [F]
    </button>
    <div class="hints">
      <div><strong>Flap:</strong> Space / Up / Click</div>
      <div><strong>Arrow (2x Smash):</strong> F / Shift / Right-Click</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const windArrowBtn = document.getElementById("windArrowBtn");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_HEIGHT = 86;
    const PLAY_HEIGHT = HEIGHT - GROUND_HEIGHT;

    const GRAVITY = 0.42;
    const FLAP_IMPULSE = -7.6;
    const BOOST_JUMP_IMPULSE = -9.8;
    const MAX_FALL_SPEED = 9.5;

    const OBSTACLE_WIDTH = 56;
    const GAP_SIZES = {
      small: 116,
      normal: 158,
      big: 212
    };
    const BASE_OBSTACLE_SPEED = 2.55;
    const SUPER_SPEED_MULTIPLIER = 1.65;
    const SPAWN_INTERVAL_FRAMES = 98;

    const ARROW_COOLDOWN_MS = 4000;
    const ARROW_SPEED = 11.5;
    const ARROW_MAX_DESTROYS = 2;

    const POWERUP_DURATION_MS = 5000;
    const RAINBOW_DURATION_MS = 10000;
    const POWERUP_WEIGHTS = [
      { type: "strength", weight: 24.25 },
      { type: "speed", weight: 24.25 },
      { type: "noclip", weight: 24.25 },
      { type: "jump", weight: 24.25 },
      { type: "rainbow", weight: 3 }
    ];
    const POWERUP_META = {
      strength: {
        label: "SUPER STRENGTH",
        badge: "STR",
        color: "#ef4444",
        glow: "rgba(239, 68, 68, 0.45)",
        pillBg: "rgba(127, 29, 29, 0.85)",
        border: "#fca5a5"
      },
      speed: {
        label: "SUPER SPEED",
        badge: "SPD",
        color: "#f59e0b",
        glow: "rgba(245, 158, 11, 0.45)",
        pillBg: "rgba(120, 53, 15, 0.85)",
        border: "#fde68a"
      },
      noclip: {
        label: "NO-CLIP",
        badge: "GHOST",
        color: "#a855f7",
        glow: "rgba(168, 85, 247, 0.45)",
        pillBg: "rgba(76, 29, 149, 0.85)",
        border: "#e9d5ff"
      },
      jump: {
        label: "JUMP BOOST",
        badge: "JUMP",
        color: "#38bdf8",
        glow: "rgba(56, 189, 248, 0.45)",
        pillBg: "rgba(12, 74, 110, 0.85)",
        border: "#bae6fd"
      },
      rainbow: {
        label: "RAINBOW OVERDRIVE",
        badge: "RNBW",
        color: "#f472b6",
        glow: "rgba(244, 114, 182, 0.55)",
        pillBg: "rgba(30, 27, 75, 0.88)",
        border: "#f9a8d4"
      }
    };

    const CHECKPOINT_MILESTONES = [
      { level: 30, name: "GRASSLAND CHECKPOINT", biome: "grassland" },
      { level: 60, name: "FLOWER MEADOW CHECKPOINT", biome: "meadow" },
      { level: 90, name: "DEEP FOREST CHECKPOINT", biome: "forest" },
      { level: 100, name: "VOLCANO CHECKPOINT", biome: "volcano" }
    ];

    // ---------------- SAFE WEB AUDIO ENGINE ----------------
    let audioCtx = null;
    let masterOut = null;
    let forestAmbience = null;
    let chirpTimerMs = 1900;
    let lastSoundTime = {
      jump: 0,
      phase: 0,
      smash: 0,
      death: 0,
      star: 0,
      dance: 0,
      sonic: 0,
      whizz: 0,
      wahhooo: 0
    };

    function ensureAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
          masterOut = audioCtx.createGain();
          masterOut.gain.setValueAtTime(1.0, audioCtx.currentTime);
          masterOut.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        if (audioCtx.state === "running" && !forestAmbience) {
          initForestAmbience(audioCtx);
        }
        return audioCtx.state === "running" ? audioCtx : null;
      } catch (_) {
        return null;
      }
    }

    function initForestAmbience(ctxAudio) {
      try {
        const len = Math.floor(ctxAudio.sampleRate * 1.2);
        const buf = ctxAudio.createBuffer(1, len, ctxAudio.sampleRate);
        const ch = buf.getChannelData(0);
        let prev = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          prev = (prev + 0.025 * w) / 1.025;
          ch[i] = prev * 2.0;
        }

        const src = ctxAudio.createBufferSource();
        src.buffer = buf;
        src.loop = true;

        const filter = ctxAudio.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(480, ctxAudio.currentTime);
        filter.Q.setValueAtTime(1.0, ctxAudio.currentTime);

        const gain = ctxAudio.createGain();
        gain.gain.setValueAtTime(0.0001, ctxAudio.currentTime);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(masterOut);
        src.start();

        forestAmbience = { gain };
      } catch (_) {
        forestAmbience = null;
      }
    }

    function updateForestAmbience(dtMs) {
      try {
        if (!audioCtx || audioCtx.state !== "running") return;
        if (!forestAmbience) {
          initForestAmbience(audioCtx);
        }
        if (!forestAmbience) return;

        const active = gameState === "playing" || gameState === "start";
        const target = active ? (getCurrentBiome() === "volcano" ? 0.02 : 0.065) : 0.0001;
        forestAmbience.gain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.15);

        if (!active || getCurrentBiome() === "volcano") return;

        chirpTimerMs -= dtMs;
        if (chirpTimerMs <= 0) {
          chirpTimerMs = 2000 + Math.random() * 2500;
          playForestBirdChirp();
        }
      } catch (_) {}
    }

    function playForestBirdChirp() {
      try {
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const now = ctxAudio.currentTime;
        const f = 2200 + Math.random() * 950;

        for (let i = 0; i < 2; i++) {
          const t = now + i * 0.11;
          const osc = ctxAudio.createOscillator();
          const g = ctxAudio.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(f * 1.25, t + 0.055);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.022, t + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
          osc.connect(g);
          g.connect(masterOut);
          osc.start(t);
          osc.stop(t + 0.09);
        }
      } catch (_) {}
    }

    // Loud Mario "WAH-HOOO!!!" sound when collecting a Jump Boost orb
    function playMarioWahHoooSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.wahhooo < 140) return;
        lastSoundTime.wahhooo = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;

        const wahhoooBoost = ctxAudio.createGain();
        wahhoooBoost.gain.setValueAtTime(1.45, t);
        wahhoooBoost.connect(masterOut);

        // Syllable 1: loud punchy "WAH!" (0.00s - 0.16s)
        const wahOsc = ctxAudio.createOscillator();
        const wahHarm = ctxAudio.createOscillator();
        const wahFormant1 = ctxAudio.createBiquadFilter();
        const wahFormant2 = ctxAudio.createBiquadFilter();
        const wahGain = ctxAudio.createGain();

        wahOsc.type = "sawtooth";
        wahHarm.type = "square";

        wahOsc.frequency.setValueAtTime(260, t);
        wahOsc.frequency.exponentialRampToValueAtTime(455, t + 0.14);

        wahHarm.frequency.setValueAtTime(520, t);
        wahHarm.frequency.exponentialRampToValueAtTime(910, t + 0.14);

        wahFormant1.type = "bandpass";
        wahFormant1.frequency.setValueAtTime(560, t);
        wahFormant1.frequency.exponentialRampToValueAtTime(1550, t + 0.15);
        wahFormant1.Q.setValueAtTime(2.4, t);

        wahFormant2.type = "peaking";
        wahFormant2.frequency.setValueAtTime(1900, t);
        wahFormant2.gain.setValueAtTime(9, t);
        wahFormant2.Q.setValueAtTime(2.0, t);

        wahGain.gain.setValueAtTime(0.001, t);
        wahGain.gain.linearRampToValueAtTime(0.88, t + 0.015);
        wahGain.gain.setValueAtTime(0.82, t + 0.12);
        wahGain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);

        wahOsc.connect(wahFormant1);
        wahHarm.connect(wahFormant1);
        wahFormant1.connect(wahFormant2);
        wahFormant2.connect(wahGain);
        wahGain.connect(wahhoooBoost);

        wahOsc.start(t);
        wahHarm.start(t);
        wahOsc.stop(t + 0.18);
        wahHarm.stop(t + 0.18);

        // Syllable 2: loud soaring "HOOO!!!" (0.14s - 0.54s) with joyful pitch lift & vibrato
        const hoooStart = t + 0.14;
        const hoooDur = 0.40;

        const hoooOsc = ctxAudio.createOscillator();
        const hoooHarm = ctxAudio.createOscillator();
        const vibrato = ctxAudio.createOscillator();
        const vibratoGain = ctxAudio.createGain();
        const hoooFilter = ctxAudio.createBiquadFilter();
        const hoooGain = ctxAudio.createGain();

        hoooOsc.type = "sawtooth";
        hoooHarm.type = "square";

        hoooOsc.frequency.setValueAtTime(360, hoooStart);
        hoooOsc.frequency.exponentialRampToValueAtTime(840, hoooStart + hoooDur * 0.88);

        hoooHarm.frequency.setValueAtTime(720, hoooStart);
        hoooHarm.frequency.exponentialRampToValueAtTime(1680, hoooStart + hoooDur * 0.88);

        vibrato.type = "sine";
        vibrato.frequency.setValueAtTime(18, hoooStart);
        vibratoGain.gain.setValueAtTime(18, hoooStart);
        vibrato.connect(vibratoGain);
        vibratoGain.connect(hoooOsc.frequency);

        hoooFilter.type = "bandpass";
        hoooFilter.frequency.setValueAtTime(820, hoooStart);
        hoooFilter.frequency.exponentialRampToValueAtTime(2400, hoooStart + hoooDur * 0.85);
        hoooFilter.Q.setValueAtTime(1.9, hoooStart);

        hoooGain.gain.setValueAtTime(0.001, hoooStart);
        hoooGain.gain.linearRampToValueAtTime(0.95, hoooStart + 0.02);
        hoooGain.gain.setValueAtTime(0.90, hoooStart + hoooDur * 0.7);
        hoooGain.gain.exponentialRampToValueAtTime(0.001, hoooStart + hoooDur);

        hoooOsc.connect(hoooFilter);
        hoooHarm.connect(hoooFilter);
        hoooFilter.connect(hoooGain);
        hoooGain.connect(wahhoooBoost);

        hoooOsc.start(hoooStart);
        hoooHarm.start(hoooStart);
        vibrato.start(hoooStart);
        hoooOsc.stop(hoooStart + hoooDur + 0.02);
        hoooHarm.stop(hoooStart + hoooDur + 0.02);
        vibrato.stop(hoooStart + hoooDur + 0.02);
      } catch (_) {}
    }

    // Sonic boom / high-speed burst sound when picking up Super Speed
    function playSonicSpeedSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.sonic < 120) return;
        lastSoundTime.sonic = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;

        const boom = ctxAudio.createOscillator();
        const boomGain = ctxAudio.createGain();
        boom.type = "sine";
        boom.frequency.setValueAtTime(190, t);
        boom.frequency.exponentialRampToValueAtTime(42, t + 0.26);
        boomGain.gain.setValueAtTime(0.001, t);
        boomGain.gain.linearRampToValueAtTime(0.36, t + 0.015);
        boomGain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        boom.connect(boomGain);
        boomGain.connect(masterOut);
        boom.start(t);
        boom.stop(t + 0.29);

        const sweep = ctxAudio.createOscillator();
        const sweepGain = ctxAudio.createGain();
        sweep.type = "sawtooth";
        sweep.frequency.setValueAtTime(260, t);
        sweep.frequency.exponentialRampToValueAtTime(1650, t + 0.14);
        sweep.frequency.exponentialRampToValueAtTime(420, t + 0.34);

        const sweepFilter = ctxAudio.createBiquadFilter();
        sweepFilter.type = "bandpass";
        sweepFilter.frequency.setValueAtTime(900, t);
        sweepFilter.frequency.exponentialRampToValueAtTime(2400, t + 0.14);
        sweepFilter.Q.setValueAtTime(1.8, t);

        sweepGain.gain.setValueAtTime(0.001, t);
        sweepGain.gain.linearRampToValueAtTime(0.18, t + 0.03);
        sweepGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        sweep.connect(sweepFilter);
        sweepFilter.connect(sweepGain);
        sweepGain.connect(masterOut);
        sweep.start(t);
        sweep.stop(t + 0.36);

        const len = Math.floor(ctxAudio.sampleRate * 0.34);
        const buf = ctxAudio.createBuffer(1, len, ctxAudio.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, 1.45);
          ch[i] = (Math.random() * 2 - 1) * env;
        }
        const noise = ctxAudio.createBufferSource();
        noise.buffer = buf;

        const airFilter = ctxAudio.createBiquadFilter();
        airFilter.type = "bandpass";
        airFilter.frequency.setValueAtTime(600, t);
        airFilter.frequency.exponentialRampToValueAtTime(2800, t + 0.12);
        airFilter.frequency.exponentialRampToValueAtTime(750, t + 0.34);
        airFilter.Q.setValueAtTime(1.2, t);

        const airGain = ctxAudio.createGain();
        airGain.gain.setValueAtTime(0.001, t);
        airGain.gain.linearRampToValueAtTime(0.32, t + 0.02);
        airGain.gain.exponentialRampToValueAtTime(0.001, t + 0.34);

        noise.connect(airFilter);
        airFilter.connect(airGain);
        airGain.connect(masterOut);
        noise.start(t);
      } catch (_) {}
    }

    // Realistic arrow whizzing through the air when firing Wind Arrow
    function playArrowWhizzSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.whizz < 75) return;
        lastSoundTime.whizz = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;
        const dur = 0.22;

        const len = Math.floor(ctxAudio.sampleRate * dur);
        const buf = ctxAudio.createBuffer(1, len, ctxAudio.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const p = i / len;
          const swell = Math.sin(Math.min(1, p * 1.35) * Math.PI);
          ch[i] = (Math.random() * 2 - 1) * swell;
        }

        const noise = ctxAudio.createBufferSource();
        noise.buffer = buf;

        const whizzFilter = ctxAudio.createBiquadFilter();
        whizzFilter.type = "bandpass";
        whizzFilter.frequency.setValueAtTime(2900, t);
        whizzFilter.frequency.exponentialRampToValueAtTime(1950, t + 0.08);
        whizzFilter.frequency.exponentialRampToValueAtTime(820, t + dur);
        whizzFilter.Q.setValueAtTime(5.5, t);

        const whizzGain = ctxAudio.createGain();
        whizzGain.gain.setValueAtTime(0.001, t);
        whizzGain.gain.linearRampToValueAtTime(0.34, t + 0.03);
        whizzGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

        noise.connect(whizzFilter);
        whizzFilter.connect(whizzGain);
        whizzGain.connect(masterOut);
        noise.start(t);

        const whistle = ctxAudio.createOscillator();
        const whistleGain = ctxAudio.createGain();
        whistle.type = "sine";
        whistle.frequency.setValueAtTime(1750, t);
        whistle.frequency.exponentialRampToValueAtTime(690, t + dur * 0.9);
        whistleGain.gain.setValueAtTime(0.001, t);
        whistleGain.gain.linearRampToValueAtTime(0.055, t + 0.025);
        whistleGain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.92);
        whistle.connect(whistleGain);
        whistleGain.connect(masterOut);
        whistle.start(t);
        whistle.stop(t + dur);
      } catch (_) {}
    }

    function playMarioJumpSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.jump < 60) return;
        lastSoundTime.jump = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;
        const osc = ctxAudio.createOscillator();
        const g = ctxAudio.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(195, t);
        osc.frequency.exponentialRampToValueAtTime(590, t + 0.15);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.085, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(g);
        g.connect(masterOut);
        osc.start(t);
        osc.stop(t + 0.17);
      } catch (_) {}
    }

    function playMarioSuperStarSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.star < 300) return;
        lastSoundTime.star = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const notes = [
          659.25, 659.25, 659.25, 0, 523.25, 659.25, 0, 783.99, 0, 392.0, 0,
          523.25, 0, 392.0, 0, 329.63, 0, 440.0, 0, 493.88, 0, 466.16, 440.0
        ];
        const step = 0.075;
        const base = ctxAudio.currentTime + 0.01;

        for (let i = 0; i < notes.length; i++) {
          const freq = notes[i];
          if (!freq) continue;
          const t = base + i * step;
          const osc = ctxAudio.createOscillator();
          const g = ctxAudio.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(0.08, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t + step * 0.9);
          osc.connect(g);
          g.connect(masterOut);
          osc.start(t);
          osc.stop(t + step);
        }
      } catch (_) {}
    }

    function playMarioPhaseSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.phase < 90) return;
        lastSoundTime.phase = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;
        const osc = ctxAudio.createOscillator();
        const g = ctxAudio.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
        osc.frequency.exponentialRampToValueAtTime(420, t + 0.18);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.11, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
        osc.connect(g);
        g.connect(masterOut);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch (_) {}
    }

    function playAppleSmashSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.smash < 70) return;
        lastSoundTime.smash = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;

        const thud = ctxAudio.createOscillator();
        const thudGain = ctxAudio.createGain();
        thud.type = "sine";
        thud.frequency.setValueAtTime(160, t);
        thud.frequency.exponentialRampToValueAtTime(48, t + 0.14);
        thudGain.gain.setValueAtTime(0.24, t);
        thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        thud.connect(thudGain);
        thudGain.connect(masterOut);
        thud.start(t);
        thud.stop(t + 0.16);

        const len = Math.floor(ctxAudio.sampleRate * 0.14);
        const buf = ctxAudio.createBuffer(1, len, ctxAudio.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.8);
        }
        const noise = ctxAudio.createBufferSource();
        noise.buffer = buf;

        const filter = ctxAudio.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(2400, t);
        filter.Q.setValueAtTime(1.6, t);

        const nGain = ctxAudio.createGain();
        nGain.gain.setValueAtTime(0.3, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(masterOut);
        noise.start(t);
      } catch (_) {}
    }

    function playRobloxDeathSound() {
      try {
        const nowMs = performance.now();
        if (nowMs - lastSoundTime.death < 300) return;
        lastSoundTime.death = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const t = ctxAudio.currentTime;
        const dur = 0.78;

        const osc1 = ctxAudio.createOscillator();
        const osc2 = ctxAudio.createOscillator();
        const sub = ctxAudio.createOscillator();
        const filter = ctxAudio.createBiquadFilter();
        const g = ctxAudio.createGain();

        osc1.type = "sawtooth";
        osc2.type = "square";
        sub.type = "triangle";

        osc1.frequency.setValueAtTime(175, t);
        osc1.frequency.exponentialRampToValueAtTime(230, t + 0.08);
        osc1.frequency.exponentialRampToValueAtTime(82, t + dur);

        osc2.frequency.setValueAtTime(350, t);
        osc2.frequency.exponentialRampToValueAtTime(450, t + 0.08);
        osc2.frequency.exponentialRampToValueAtTime(158, t + dur);

        sub.frequency.setValueAtTime(98, t);
        sub.frequency.exponentialRampToValueAtTime(50, t + dur);

        filter.type = "bandpass";
        filter.Q.setValueAtTime(2.0, t);
        filter.frequency.setValueAtTime(600, t);
        filter.frequency.exponentialRampToValueAtTime(235, t + dur);

        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.68, t + 0.025);
        g.gain.setValueAtTime(0.62, t + 0.42);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);

        osc1.connect(filter);
        osc2.connect(filter);
        sub.connect(filter);
        filter.connect(g);
        g.connect(masterOut);

        osc1.start(t);
        osc2.start(t);
        sub.start(t);
        osc1.stop(t + dur + 0.02);
        osc2.stop(t + dur + 0.02);
        sub.stop(t + dur + 0.02);
      } catch (_) {}
    }

    function playFortniteDanceSong() {

        if (nowMs - lastSoundTime.dance < 500) return;
        lastSoundTime.dance = nowMs;

        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const tempoBpm = 128;
        const stepSec = 60 / tempoBpm / 2;
        const melodyNotes = [
          659.25, 0, 783.99, 880.0, 987.77, 0, 880.0, 783.99,
          659.25, 783.99, 880.0, 1046.5, 987.77, 880.0, 783.99, 659.25,
          587.33, 0, 659.25, 783.99, 880.0, 0, 783.99, 659.25,
          587.33, 659.25, 783.99, 880.0, 783.99, 659.25, 587.33, 0
        ];
        const bassNotes = [
          164.81, 164.81, 196.0, 196.0, 220.0, 220.0, 196.0, 196.0,
          164.81, 164.81, 220.0, 220.0, 246.94, 220.0, 196.0, 164.81,
          146.83, 146.83, 196.0, 196.0, 220.0, 220.0, 196.0, 164.81,
          146.83, 164.81, 196.0, 220.0, 196.0, 164.81, 146.83, 146.83
        ];

        const base = ctxAudio.currentTime + 0.02;
        for (let i = 0; i < melodyNotes.length; i++) {
          const start = base + i * stepSec;
          const freq = melodyNotes[i];
          if (freq > 0) {
            const osc = ctxAudio.createOscillator();
            const g = ctxAudio.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, start);
            g.gain.setValueAtTime(0.001, start);
            g.gain.exponentialRampToValueAtTime(0.06, start + 0.014);
            g.gain.exponentialRampToValueAtTime(0.001, start + stepSec * 0.88);
            osc.connect(g);
            g.connect(masterOut);
            osc.start(start);
            osc.stop(start + stepSec);
          }

          const bFreq = bassNotes[i];
          if (bFreq > 0) {
            const bOsc = ctxAudio.createOscillator();
            const bGain = ctxAudio.createGain();
            bOsc.type = "triangle";
            bOsc.frequency.setValueAtTime(bFreq, start);
            bGain.gain.setValueAtTime(0.001, start);
            bGain.gain.exponentialRampToValueAtTime(0.11, start + 0.012);
            bGain.gain.exponentialRampToValueAtTime(0.001, start + stepSec * 0.86);
            bOsc.connect(bGain);
            bGain.connect(masterOut);
            bOsc.start(start);
            bOsc.stop(start + stepSec);
          }
        }

    function circleIntersectsRect(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < cr * cr;
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
      const steps = 6;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        if (px >= rx - 8 && px <= rx + rw + 8 && py >= ry - 8 && py <= ry + rh + 8) {
          return true;
        }
      }
      return false;
    }

    function updateHudButton() {

        windArrowBtn.disabled = true;

      if (arrowCooldownRemaining > 0) {

    function update(dtMs) {
      const safeDtMs = Math.min(50, Math.max(0, dtMs));
      const dtScale = safeDtMs / (1000 / 60);

      updateForestAmbience(safeDtMs);

      if (checkpointBanner.active) {
        checkpointBanner.remainingMs = Math.max(0, checkpointBanner.remainingMs - safeDtMs);
        if (checkpointBanner.remainingMs <= 0) {
          checkpointBanner.active = false;
        }
      }

      if (gameState === "cutscene_100" || gameState === "cutscene_120") {
        frames += dtScale * 0.65;
        archer.scarfPhase += 0.2 * dtScale;
        archer.birdWingPhase += 0.25 * dtScale;
        updateHudButton();
        return;
      }

      const baseEnvMult = gameState === "playing" ? 1.0 : 0.45;
      const speedMult = gameState === "playing" ? baseEnvMult * getCurrentSpeedMultiplier() : baseEnvMult;

      for (const leaf of ambientLeaves) {
        leaf.x += leaf.speedX * speedMult * dtScale;
        leaf.y += (leaf.speedY + Math.sin(frames * 0.04 + leaf.phase) * 0.35) * dtScale;
        if (leaf.x < -12) {
          leaf.x = WIDTH + 12;
          leaf.y = Math.random() * PLAY_HEIGHT;
        }
        if (leaf.y > PLAY_HEIGHT - 6) {
          leaf.y = 0;
        }
      }

      for (const rib of windRibbons) {
        rib.x -= rib.speed * speedMult * dtScale;
        if (rib.x + rib.len < 0) {
          rib.x = WIDTH + 20;
          rib.y = 55 + Math.random() * (PLAY_HEIGHT - 120);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dtScale;
        p.y += p.vy * dtScale;
        if (p.type === "chunk") {
          p.vy += 0.24 * dtScale;
          p.rot += p.vRot * dtScale;
        }
        p.life -= dtScale;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      if (screenShake > 0) {
        screenShake *= Math.pow(0.84, dtScale);
        if (screenShake < 0.2) screenShake = 0;
      }

      if (shootAnimTimer > 0) {
        shootAnimTimer = Math.max(0, shootAnimTimer - dtScale);
      }

      if (gameState === "start") {
        frames += dtScale;
        archer.y = PLAY_HEIGHT * 0.46 + Math.sin(frames * 0.07) * 8;
        archer.tilt = Math.sin(frames * 0.07) * 0.08;
        archer.scarfPhase += 0.16 * dtScale;
        archer.birdWingPhase += 0.22 * dtScale;
        updateHudButton();
        return;
      }

      if (gameState !== "playing") {
        updateHudButton();
        return;
      }

      frames += dtScale;

      if (arrowCooldownRemaining > 0) {
        arrowCooldownRemaining = Math.max(0, arrowCooldownRemaining - safeDtMs);
      }

      if (rainbowMode.active) {
        rainbowMode.remainingMs = Math.max(0, rainbowMode.remainingMs - safeDtMs);
        if (rainbowMode.remainingMs <= 0) {
          rainbowMode = { active: false, remainingMs: 0 };
        }
      }

      if (activePowerup.type) {
        activePowerup.remainingMs = Math.max(0, activePowerup.remainingMs - safeDtMs);
        if (activePowerup.remainingMs <= 0) {
          activePowerup = { type: null, remainingMs: 0 };
        }
      }

      updateHudButton();

      archer.vy = Math.min(MAX_FALL_SPEED + (hasJumpEffect() ? 1.5 : 0), archer.vy + GRAVITY * dtScale);
      archer.y += archer.vy * dtScale;
      archer.tilt = Math.max(-0.45, Math.min(Math.PI * 0.44, archer.vy * 0.068));
      archer.scarfPhase += (hasSpeedEffect() ? 0.38 : 0.24) * dtScale;

      if (archer.birdFlapBoost > 0) {
        archer.birdFlapBoost = Math.max(0, archer.birdFlapBoost - 0.05 * dtScale);
        archer.birdWingPhase += 0.55 * dtScale;
      } else {
        archer.birdWingPhase += 0.18 * dtScale;
      }

      if (archer.y - archer.radius < 4) {
        archer.y = 4 + archer.radius;
        if (archer.vy < 0) archer.vy = 0;
      }

      if (archer.y + archer.radius >= PLAY_HEIGHT) {
        archer.y = PLAY_HEIGHT - archer.radius;
        triggerGameOver();
        return;
      }

      spawnTimerFrames += dtScale * getCurrentSpeedMultiplier();
      if (spawnTimerFrames >= SPAWN_INTERVAL_FRAMES) {
        spawnTimerFrames -= SPAWN_INTERVAL_FRAMES;
        spawnObstaclePair();
      }

      const obstacleSpeed = getCurrentObstacleSpeed();
      const isVolcano = getCurrentBiome() === "volcano";

      for (let i = checkpointFlags.length - 1; i >= 0; i--) {
        checkpointFlags[i].x -= obstacleSpeed * dtScale;
        if (checkpointFlags[i].x < -60) {
          checkpointFlags.splice(i, 1);
        }
      }

      for (let i = powerupOrbs.length - 1; i >= 0; i--) {
        const orb = powerupOrbs[i];
        orb.x -= obstacleSpeed * dtScale;
        orb.bobPhase += 0.08 * dtScale;
        const bobY = orb.y + Math.sin(orb.bobPhase) * 6;

        const dx = archer.x - orb.x;
        const dy = archer.y - bobY;
        if (dx * dx + dy * dy <= (archer.radius + orb.radius) ** 2) {
          activatePowerupOrb(orb.type);
          powerupOrbs.splice(i, 1);
          continue;
        }

        if (orb.x < -40) {
          powerupOrbs.splice(i, 1);
        }
      }

      for (let i = arrows.length - 1; i >= 0; i--) {
        const ar = arrows[i];
        ar.trail.push({ x: ar.x, y: ar.y });
        if (ar.trail.length > 9) ar.trail.shift();

        const prevX = ar.x;
        const prevY = ar.y;
        ar.x += ar.vx * dtScale;
        ar.y += ar.vy * dtScale;

        if (Math.random() < 0.65) {
          particles.push({
            x: ar.x - 8,
            y: ar.y + (Math.random() - 0.5) * 6,
            vx: -2.2 - Math.random() * 1.5,
            vy: (Math.random() - 0.5) * 1.4,
            size: 2.2 + Math.random() * 2.5,
            life: 12,
            maxLife: 12,
            color: "#86efac",
            type: "spark"
          });
        }

        for (const obs of obstacles) {
          if (ar.destroysLeft <= 0) break;

          const topKey = `${obs.id}-top`;
          if (
            !obs.topDestroyed &&
            obs.topHeight > 0 &&
            !ar.hitIds.has(topKey) &&
            segmentIntersectsRect(prevX, prevY, ar.x, ar.y, obs.x, 0, OBSTACLE_WIDTH, obs.topHeight)
          ) {
            obs.topDestroyed = true;
            ar.hitIds.add(topKey);
            ar.destroysLeft--;
            screenShake = Math.max(screenShake, 5.5);
            playAppleSmashSound();
            spawnObstacleDebris(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight, isVolcano);
            spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, obs.topHeight, 12, isVolcano ? "#fb923c" : "#4ade80");
            if (ar.destroysLeft <= 0) break;
          }

          const botKey = `${obs.id}-bot`;
          const botHeight = PLAY_HEIGHT - obs.bottomY;
          if (
            !obs.bottomDestroyed &&
            botHeight > 0 &&
            !ar.hitIds.has(botKey) &&
            segmentIntersectsRect(prevX, prevY, ar.x, ar.y, obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight)
          ) {
            obs.bottomDestroyed = true;
            ar.hitIds.add(botKey);
            ar.destroysLeft--;
            screenShake = Math.max(screenShake, 5.5);
            playAppleSmashSound();
            spawnObstacleDebris(obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight, isVolcano);
            spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, obs.bottomY, 12, isVolcano ? "#fb923c" : "#4ade80");
            if (ar.destroysLeft <= 0) break;
          }
        }

        if (ar.destroysLeft <= 0 || ar.x > WIDTH + 50 || ar.y < -30 || ar.y > PLAY_HEIGHT + 30) {
          arrows.splice(i, 1);
        }
      }

      const canSmash = hasStrengthEffect();
      const canPassGhost = hasNoClipEffect();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= obstacleSpeed * dtScale;
        obs.swayPhase += 0.05 * dtScale;

        const botHeight = PLAY_HEIGHT - obs.bottomY;

        const touchingTop =
          !obs.topDestroyed &&
          circleIntersectsRect(archer.x, archer.y, archer.radius - 2, obs.x, 0, OBSTACLE_WIDTH, obs.topHeight);
        const touchingBottom =
          !obs.bottomDestroyed &&
          circleIntersectsRect(archer.x, archer.y, archer.radius - 2, obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight);

        if (canPassGhost) {
          if (touchingTop && !obs.topPhased) {
            obs.topPhased = true;
            playMarioPhaseSound();
            spawnWindBurst(archer.x, archer.y, 10, "#c084fc");
          }
          if (touchingBottom && !obs.bottomPhased) {
            obs.bottomPhased = true;
            playMarioPhaseSound();
            spawnWindBurst(archer.x, archer.y, 10, "#c084fc");
          }
        } else {
          if (touchingTop) {
            if (canSmash) {
              obs.topDestroyed = true;
              screenShake = Math.max(screenShake, 6.5);
              playAppleSmashSound();
              spawnObstacleDebris(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight, isVolcano);
              spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, Math.min(archer.y, obs.topHeight), 14, "#ef4444");
            } else {
              triggerGameOver();
              return;
            }
          }

          if (touchingBottom) {
            if (canSmash) {
              obs.bottomDestroyed = true;
              screenShake = Math.max(screenShake, 6.5);
              playAppleSmashSound();
              spawnObstacleDebris(obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight, isVolcano);
              spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, Math.max(archer.y, obs.bottomY), 14, "#ef4444");
            } else {
              triggerGameOver();
              return;
            }
          }
        }

        if (!obs.passed && obs.x + OBSTACLE_WIDTH < archer.x) {
          obs.passed = true;
          score++;
          if (score > bestScore) {
            bestScore = score;
            try {
              localStorage.setItem("windArcherFlappyBest", String(bestScore));
            } catch (_) {}
          }

          for (const milestone of CHECKPOINT_MILESTONES) {
            if (score >= milestone.level && !triggeredCheckpoints.has(milestone.level)) {
              triggerCheckpointReached(milestone);
            }
          }

          if (score >= 100 && !cutscene100Shown) {
            cutscene100Shown = true;
            gameState = "cutscene_100";
            return;
          }

          if (score >= 120 && !cutscene120Shown) {
            cutscene120Shown = true;
            gameState = "cutscene_120";
            return;
          }
        }

        if (obs.x + OBSTACLE_WIDTH < -40) {
          obstacles.splice(i, 1);
        }
      }
    }

    // ---------------- RENDERING ----------------
    function drawForestBackground(envMult, isDeepForest) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_HEIGHT);
      if (isDeepForest) {
        skyGrad.addColorStop(0, "#051916");
        skyGrad.addColorStop(0.45, "#0b3129");
        skyGrad.addColorStop(1, "#134739");
      } else {
        skyGrad.addColorStop(0, "#071d1a");
        skyGrad.addColorStop(0.45, "#0f3b32");
        skyGrad.addColorStop(1, "#185343");
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      ctx.save();
      for (let b = 0; b < 3; b++) {
        const bx = 75 + b * 125;
        const beamGrad = ctx.createLinearGradient(bx, 0, bx + 90, PLAY_HEIGHT);
        beamGrad.addColorStop(0, "rgba(187, 247, 208, 0.14)");
        beamGrad.addColorStop(0.7, "rgba(74, 222, 128, 0.04)");
        beamGrad.addColorStop(1, "rgba(74, 222, 128, 0)");
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(bx - 24, 0);
        ctx.lineTo(bx + 28, 0);
        ctx.lineTo(bx + 125, PLAY_HEIGHT);
        ctx.lineTo(bx + 35, PLAY_HEIGHT);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = "#0a2a24";
      ctx.beginPath();
      ctx.moveTo(0, PLAY_HEIGHT);
      ctx.quadraticCurveTo(95, PLAY_HEIGHT - 190, 210, PLAY_HEIGHT - 140);
      ctx.quadraticCurveTo(320, PLAY_HEIGHT - 215, WIDTH, PLAY_HEIGHT - 150);
      ctx.lineTo(WIDTH, PLAY_HEIGHT);
      ctx.closePath();
      ctx.fill();

      const farScroll = gameState === "playing" ? frames * 0.35 * envMult : frames * 0.12;
      const farSpan = 700;
      for (const t of farTrees) {
        const sx = (((t.x - farScroll) % farSpan) + farSpan) % farSpan - 80;
        if (sx < -90 || sx > WIDTH + 90) continue;
        const crownY = PLAY_HEIGHT - t.yOffset - 80;
        ctx.fillStyle = "#08221d";
        ctx.fillRect(sx - t.trunkW / 2, crownY, t.trunkW, PLAY_HEIGHT - crownY);
        ctx.fillStyle = "#0c352c";
        ctx.beginPath();
        ctx.arc(sx, crownY, t.canopyR, 0, Math.PI * 2);
        ctx.arc(sx - t.canopyR * 0.55, crownY + 12, t.canopyR * 0.72, 0, Math.PI * 2);
        ctx.arc(sx + t.canopyR * 0.55, crownY + 10, t.canopyR * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }

      const midScroll = gameState === "playing" ? frames * 0.75 * envMult : frames * 0.25;
      const midSpan = 682;
      for (const t of midTrees) {
        const sx = (((t.x - midScroll) % midSpan) + midSpan) % midSpan - 90;
        if (sx < -100 || sx > WIDTH + 100) continue;
        const crownY = PLAY_HEIGHT - t.yOffset - 105;
        ctx.fillStyle = "#132920";
        ctx.fillRect(sx - t.trunkW / 2, crownY, t.trunkW, PLAY_HEIGHT - crownY);
        ctx.fillStyle = "#0f4234";
        ctx.beginPath();
        ctx.arc(sx, crownY, t.canopyR, 0, Math.PI * 2);
        ctx.arc(sx - t.canopyR * 0.6, crownY + 14, t.canopyR * 0.76, 0, Math.PI * 2);
        ctx.arc(sx + t.canopyR * 0.6, crownY + 12, t.canopyR * 0.78, 0, Math.PI * 2);
        ctx.fill();
      }

      const nearScroll = gameState === "playing" ? frames * 1.15 * envMult : frames * 0.35;
      const nearSpan = 688;
      for (const t of nearTrees) {
        const sx = (((t.x - nearScroll) % nearSpan) + nearSpan) % nearSpan - 110;
        if (sx < -120 || sx > WIDTH + 120) continue;
        ctx.fillStyle = "#091712";
        ctx.fillRect(sx - t.trunkW / 2, 0, t.trunkW, PLAY_HEIGHT);
      }

      const topScroll = gameState === "playing" ? frames * 0.9 * envMult : frames * 0.3;
      const topSpan = 480;
      for (const st of canopyStrands) {
        const sx = (((st.x - topScroll) % topSpan) + topSpan) % topSpan - 20;
        const sway = Math.sin(frames * 0.05 + st.phase) * 4;
        ctx.strokeStyle = "#166534";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.quadraticCurveTo(sx + sway * 0.6, st.length * 0.5, sx + sway, st.length);
        ctx.stroke();
      }

      for (const leaf of ambientLeaves) {
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(Math.sin(frames * 0.05 + leaf.phase) * 0.7);
        ctx.fillStyle = leaf.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, leaf.size * 1.4, leaf.size * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawGrasslandBackground(envMult) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_HEIGHT);
      skyGrad.addColorStop(0, "#1d4ed8");
      skyGrad.addColorStop(0.55, "#38bdf8");
      skyGrad.addColorStop(1, "#bbf7d0");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(WIDTH - 78, 76, 30, 0, Math.PI * 2);
      ctx.fill();

      const cloudScroll = gameState === "playing" ? frames * 0.3 * envMult : frames * 0.1;
      for (let c = 0; c < 4; c++) {
        const cx = ((((c * 140 - cloudScroll) % (WIDTH + 140)) + (WIDTH + 140)) % (WIDTH + 140)) - 60;
        const cy = 62 + (c % 2) * 34;
        ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI * 2);
        ctx.arc(cx + 18, cy - 5, 24, 0, Math.PI * 2);
        ctx.arc(cx + 38, cy + 2, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      const hillScroll = gameState === "playing" ? frames * 0.55 * envMult : frames * 0.18;
      ctx.fillStyle = "#4ade80";
      ctx.beginPath();
      ctx.moveTo(0, PLAY_HEIGHT);
      for (let x = 0; x <= WIDTH + 20; x += 20) {
        const hy = PLAY_HEIGHT - 125 - Math.sin((x + hillScroll) * 0.014) * 36;
        ctx.lineTo(x, hy);
      }
      ctx.lineTo(WIDTH, PLAY_HEIGHT);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.moveTo(0, PLAY_HEIGHT);
      for (let x = 0; x <= WIDTH + 20; x += 20) {
        const hy = PLAY_HEIGHT - 68 - Math.cos((x + hillScroll * 1.4) * 0.02) * 24;
        ctx.lineTo(x, hy);
      }
      ctx.lineTo(WIDTH, PLAY_HEIGHT);
      ctx.closePath();
      ctx.fill();
    }

    function drawMeadowBackground(envMult) {
      drawGrasslandBackground(envMult);

      const flowerScroll = gameState === "playing" ? frames * 1.15 * envMult : frames * 0.35;
      for (const fl of meadowFlowers) {
        const sx = ((((fl.x - flowerScroll) % (WIDTH + 40)) + (WIDTH + 40)) % (WIDTH + 40)) - 20;
        const sway = Math.sin(frames * 0.06 + fl.phase) * 3;
        ctx.strokeStyle = "#15803d";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, fl.y + 10);
        ctx.quadraticCurveTo(sx + sway * 0.5, fl.y + 4, sx + sway, fl.y);
        ctx.stroke();

        ctx.fillStyle = fl.petalColor;
        for (let p = 0; p < 5; p++) {
          const ang = (p * Math.PI * 2) / 5;
          ctx.beginPath();
          ctx.arc(sx + sway + Math.cos(ang) * 4.2, fl.y + Math.sin(ang) * 4.2, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.arc(sx + sway, fl.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawVolcanoBackground(envMult) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_HEIGHT);
      skyGrad.addColorStop(0, "#1c0707");
      skyGrad.addColorStop(0.5, "#450a0a");
      skyGrad.addColorStop(1, "#7c2d12");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      const magScroll = gameState === "playing" ? frames * 0.65 * envMult : frames * 0.2;
      ctx.fillStyle = "#290b0b";
      ctx.beginPath();
      ctx.moveTo(0, PLAY_HEIGHT);
      for (let x = 0; x <= WIDTH + 20; x += 20) {
        const ry = PLAY_HEIGHT - 140 - Math.abs(Math.sin((x + magScroll) * 0.018)) * 55;
        ctx.lineTo(x, ry);
      }
      ctx.lineTo(WIDTH, PLAY_HEIGHT);
      ctx.closePath();
      ctx.fill();

      for (let e = 0; e < 24; e++) {
        const ex = ((((e * 37 - magScroll * 1.2) % WIDTH) + WIDTH) % WIDTH);
        const ey = PLAY_HEIGHT - ((((e * 49 + frames * (1.2 + (e % 3) * 0.5)) % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT);
        ctx.fillStyle = e % 2 === 0 ? "#fb923c" : "#fde047";
        ctx.beginPath();
        ctx.arc(ex, ey, 2 + (e % 3), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBackground() {
      const envMult = gameState === "playing" ? getCurrentSpeedMultiplier() : 0.45;
      const biome = getCurrentBiome();

      if (biome === "grassland") {
        drawGrasslandBackground(envMult);
      } else if (biome === "meadow") {
        drawMeadowBackground(envMult);
      } else if (biome === "volcano") {
        drawVolcanoBackground(envMult);
      } else {
        drawForestBackground(envMult, score >= 90);
      }

      for (const rib of windRibbons) {
        ctx.save();
        ctx.strokeStyle = biome === "volcano" ? `rgba(253, 186, 116, ${rib.alpha})` : `rgba(187, 247, 208, ${rib.alpha})`;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(rib.x, rib.y);
        ctx.quadraticCurveTo(rib.x + rib.len * 0.5, rib.y - 6, rib.x + rib.len, rib.y + 2);
        ctx.stroke();
        ctx.restore();
      }

      if (gameState === "playing" && hasSpeedEffect()) {
        ctx.save();
        ctx.strokeStyle = rainbowMode.active ? getRainbowColor(80) : "rgba(253, 230, 138, 0.35)";
        ctx.lineWidth = 2;
        for (let s = 0; s < 7; s++) {
          const sy = 55 + ((s * 68 + frames * 7) % (PLAY_HEIGHT - 80));
          const sx = WIDTH - ((frames * 16 + s * 92) % (WIDTH + 120));
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + 44, sy);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawCheckpointFlags() {
      for (const flag of checkpointFlags) {
        ctx.save();
        ctx.translate(flag.x, PLAY_HEIGHT);

        const beamGrad = ctx.createLinearGradient(0, 0, 0, -PLAY_HEIGHT);
        beamGrad.addColorStop(0, "rgba(250, 204, 21, 0.35)");
        beamGrad.addColorStop(1, "rgba(250, 204, 21, 0)");
        ctx.fillStyle = beamGrad;
        ctx.fillRect(-10, -PLAY_HEIGHT, 20, PLAY_HEIGHT);

        ctx.strokeStyle = "#fef08a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -64);
        ctx.stroke();

        const wave = Math.sin(frames * 0.25) * 3;
        ctx.fillStyle = "#f97316";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, -64);
        ctx.lineTo(26, -55 + wave);
        ctx.lineTo(0, -46);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 10px 'Trebuchet MS', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(flag.label, 0, -72);

        ctx.restore();
      }
    }

    function drawLavaObstacle(x, y, w, h, isTop, swayPhase) {
      if (h <= 0) return;

      ctx.save();
      if (hasNoClipEffect() && !rainbowMode.active) {
        ctx.globalAlpha = 0.5;
      }

      ctx.fillStyle = "#290d0d";
      ctx.strokeStyle = "#450a0a";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.stroke();

      const lavaGrad = ctx.createLinearGradient(x, y, x + w, y);
      lavaGrad.addColorStop(0, "#dc2626");
      lavaGrad.addColorStop(0.5, "#f97316");
      lavaGrad.addColorStop(1, "#facc15");
      ctx.fillStyle = lavaGrad;
      ctx.beginPath();
      ctx.roundRect(x + 6, y + 3, w - 12, Math.max(4, h - 6), 6);
      ctx.fill();

      ctx.strokeStyle = "#fef08a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let py = y + 8; py < y + h - 6; py += 12) {
        const wave = Math.sin(py * 0.08 + swayPhase) * 8;
        if (py === y + 8) ctx.moveTo(x + w * 0.5 + wave, py);
        else ctx.lineTo(x + w * 0.5 + wave, py);
      }
      ctx.stroke();

      const lipY = isTop ? y + h - 16 : y;
      ctx.fillStyle = "#ea580c";
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(x - 4, lipY, w + 8, 16, 7);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawVineObstacle(x, y, w, h, isTop, swayPhase) {
      if (h <= 0) return;

      const centerX = x + w * 0.5;
      const stepY = 14;
      const strands = [
        { offset: -w * 0.22, width: w * 0.44, color: "#15803d", phaseShift: 0 },
        { offset: w * 0.22, width: w * 0.44, color: "#166534", phaseShift: Math.PI }
      ];

      ctx.save();
      if (hasNoClipEffect() && !rainbowMode.active) {
        ctx.globalAlpha = 0.48;
      }

      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = w * 0.56;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let py = y; py <= y + h; py += stepY) {
        const wave = Math.sin(py * 0.045 + swayPhase) * 5;
        if (py === y) ctx.moveTo(centerX + wave, py);
        else ctx.lineTo(centerX + wave, py);
      }
      ctx.lineTo(centerX + Math.sin((y + h) * 0.045 + swayPhase) * 5, y + h);
      ctx.stroke();

      for (const st of strands) {
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = st.width + 3;
        ctx.beginPath();
        for (let py = y; py <= y + h; py += 8) {
          const coil = centerX + Math.sin(py * 0.075 + swayPhase + st.phaseShift) * (w * 0.26);
          if (py === y) ctx.moveTo(coil, py);
          else ctx.lineTo(coil, py);
        }
        ctx.stroke();

        ctx.strokeStyle = st.color;
        ctx.lineWidth = st.width;
        ctx.beginPath();
        for (let py = y; py <= y + h; py += 8) {
          const coil = centerX + Math.sin(py * 0.075 + swayPhase + st.phaseShift) * (w * 0.26);
          if (py === y) ctx.moveTo(coil, py);
          else ctx.lineTo(coil, py);
        }
        ctx.stroke();
      }

      for (let ly = y + 18; ly < y + h - 14; ly += 22) {
        const idx = Math.floor((ly - y) / 22);
        const side = idx % 2 === 0 ? -1 : 1;
        const spineX = centerX + Math.sin(ly * 0.075 + swayPhase) * (w * 0.24);
        const leafX = spineX + side * (w * 0.42);
        const leafY = ly + Math.sin(swayPhase + idx) * 2;

        ctx.fillStyle = idx % 3 === 0 ? "#22c55e" : "#16a34a";
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(leafX, leafY, 10, 5, side * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = "#15803d";
      ctx.strokeStyle = "#052e16";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.roundRect(x - 3, isTop ? y + h - 18 : y, w + 6, 18, 8);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawObstacles() {
      const isVolcano = getCurrentBiome() === "volcano";
      for (const obs of obstacles) {

      ctx.fillStyle = "#16a34a";
      ctx.strokeStyle = "#bbf7d0";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(contX, btnY, btnW, btnH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
      ctx.fillText("Continue [C]", contX + btnW / 2, btnY + 14);

      ctx.fillStyle = "#991b1b";
      ctx.strokeStyle = "#fca5a5";
      ctx.beginPath();
      ctx.roundRect(giveX, btnY, btnW, btnH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.fillText("Give Up [G]", giveX + btnW / 2, btnY + 14);

      ctx.restore();
    }

    function drawCutscene120() {
      ctx.save();
      ctx.fillStyle = "rgba(25, 6, 4, 0.78)";
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      drawFireSpiritPortrait(WIDTH * 0.5, PLAY_HEIGHT * 0.25);

      const boxX = 24;
      const boxY = PLAY_HEIGHT * 0.42;
      const boxW = WIDTH - 48;
      const boxH = 226;

      ctx.fillStyle = "rgba(42, 10, 8, 0.95)";
      ctx.strokeStyle = "#fb923c";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fde047";
      ctx.font = "bold 16px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("LEVEL 120 — FIRE SPIRIT COOKIE", WIDTH / 2, boxY + 26);

      ctx.fillStyle = "#ffedd5";
      ctx.font = "12px 'Trebuchet MS', sans-serif";
      ctx.fillText("Fire Spirit Cookie flares with blazing flame:", WIDTH / 2, boxY + 54);
      ctx.fillText("\"So the wind dares the heart of my volcano!\"", WIDTH / 2, boxY + 72);

      const btnW = 190;
      const btnH = 40;
      const btnX = (WIDTH - btnW) / 2;
      const btnY = boxY + 118;
      cutsceneButtons.nextBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

      ctx.fillStyle = "#ea580c";
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
      ctx.fillText("Keep Flying [Space/C]", btnX + btnW / 2, btnY + 14);

      ctx.restore();
    }

    function drawGround() {
      const biome = getCurrentBiome();
      const soilGrad = ctx.createLinearGradient(0, PLAY_HEIGHT, 0, HEIGHT);

      if (biome === "volcano") {
        soilGrad.addColorStop(0, "#450a0a");
        soilGrad.addColorStop(0.35, "#290606");
        soilGrad.addColorStop(1, "#120303");
        ctx.fillStyle = soilGrad;
        ctx.fillRect(0, PLAY_HEIGHT, WIDTH, GROUND_HEIGHT);

        ctx.fillStyle = "#ea580c";
        ctx.fillRect(0, PLAY_HEIGHT, WIDTH, 16);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(0, PLAY_HEIGHT, WIDTH, 5);
        return;
      }

      soilGrad.addColorStop(0, "#3f2718");
      soilGrad.addColorStop(0.35, "#29180e");
      soilGrad.addColorStop(1, "#160c07");
      ctx.fillStyle = soilGrad;
      ctx.fillRect(0, PLAY_HEIGHT, WIDTH, GROUND_HEIGHT);

      ctx.fillStyle = "#16a34a";
      ctx.fillRect(0, PLAY_HEIGHT, WIDTH, 16);

      ctx.fillStyle = "#4ade80";
      ctx.fillRect(0, PLAY_HEIGHT, WIDTH, 5);

      const envMult = gameState === "playing" ? getCurrentSpeedMultiplier() : 0.45;
      const turfScroll = gameState === "playing" ? frames * 2.55 * envMult : frames * 0.8;
      const step = 22;

      for (let gx = -step; gx <= WIDTH + step; gx += step) {
        const sx = (((gx - turfScroll) % (WIDTH + step * 2)) + (WIDTH + step * 2)) % (WIDTH + step * 2) - step;
        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.moveTo(sx, PLAY_HEIGHT + 16);
        ctx.lineTo(sx + 6, PLAY_HEIGHT + 6);
        ctx.lineTo(sx + 12, PLAY_HEIGHT + 16);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;

        if (p.type === "chunk") {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.strokeStyle = "#052e16";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function drawCheckpointBanner() {
      if (!checkpointBanner.active) return;

      const fadeIn = Math.min(1, (checkpointBanner.durationMs - checkpointBanner.remainingMs) / 250);
      const fadeOut = Math.min(1, checkpointBanner.remainingMs / 400);
      const alpha = Math.max(0, Math.min(fadeIn, fadeOut));

      ctx.save();
      ctx.globalAlpha = alpha;

      const w = 310;
      const h = 54;
      const x = (WIDTH - w) / 2;
      const y = 92;

      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fde047";
      ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(checkpointBanner.title, WIDTH / 2, y + 14);

      ctx.fillStyle = "#86efac";
      ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
      ctx.fillText(checkpointBanner.subtitle, WIDTH / 2, y + 34);

      ctx.restore();
    }

    function drawHud() {
      ctx.save();
      ctx.font = "bold 36px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(5, 46, 22, 0.85)";
      ctx.strokeText(String(score), WIDTH / 2, 18);
      ctx.fillStyle = "#ecfdf5";
      ctx.fillText(String(score), WIDTH / 2, 18);

      ctx.font = "bold 12px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "left";
      ctx.fillStyle = "#bbf7d0";
      ctx.fillText(`LVL ${score} • ${getBiomeLabel(getCurrentBiome())}`, 14, 16);

      ctx.textAlign = "right";
      ctx.fillText(`BEST: ${bestScore}`, WIDTH - 14, 16);

      let statusY = 48;
      if (rainbowMode.active) {
        const secLeft = (rainbowMode.remainingMs / 1000).toFixed(1);
        const ratio = Math.max(0, Math.min(1, rainbowMode.remainingMs / RAINBOW_DURATION_MS));
        const pillW = 186;
        const pillH = 28;
        const pillX = 14;

        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.strokeStyle = getRainbowColor(0);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(pillX, statusY, pillW, pillH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = getRainbowColor(90);
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        ctx.roundRect(pillX + 2, statusY + 2, (pillW - 4) * ratio, pillH - 4, 6);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(`RAINBOW OVERDRIVE (${secLeft}s)`, pillX + 9, statusY + pillH / 2 + 0.5);
        statusY += 34;
      }

      if (gameState === "playing" && activePowerup.type) {
        const meta = POWERUP_META[activePowerup.type];
        const secLeft = (activePowerup.remainingMs / 1000).toFixed(1);
        const ratio = Math.max(0, Math.min(1, activePowerup.remainingMs / POWERUP_DURATION_MS));

        const pillW = 166;
        const pillH = 28;
        const pillX = 14;

        ctx.fillStyle = meta.pillBg;
        ctx.strokeStyle = meta.border;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.roundRect(pillX, statusY, pillW, pillH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
        ctx.beginPath();
        ctx.roundRect(pillX + 2, statusY + 2, (pillW - 4) * ratio, pillH - 4, 6);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(`${meta.label} (${secLeft}s)`, pillX + 9, statusY + pillH / 2 + 0.5);
      }

      ctx.restore();
    }

    function drawStartOverlay() {
      ctx.save();
      ctx.fillStyle = "rgba(4, 20, 18, 0.45)";
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      const boxW = 310;
      const boxH = 196;
      const boxX = (WIDTH - boxW) / 2;
      const boxY = PLAY_HEIGHT * 0.24;

      ctx.fillStyle = "rgba(8, 36, 32, 0.9)";
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#86efac";
      ctx.font = "bold 20px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("WIND ARCHER COOKIE", WIDTH / 2, boxY + 28);

      ctx.fillStyle = "#ecfdf5";
      ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
      ctx.fillText("Forest Vine Flight", WIDTH / 2, boxY + 50);

      ctx.fillStyle = "#bbf7d0";
      ctx.font = "12px 'Trebuchet MS', sans-serif";
      ctx.fillText("• Checkpoints at Lvl 30, 60, 90 & 100 play dance song", WIDTH / 2, boxY + 80);
      ctx.fillText("• Lvl 100 & 120: Millennial Tree & Fire Spirit", WIDTH / 2, boxY + 102);
      ctx.fillText("• Ultra-rare Rainbow Orb = 10s Overdrive", WIDTH / 2, boxY + 124);

      ctx.fillStyle = "#4ade80";
      ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
      ctx.fillText("Press Space or Click to Fly", WIDTH / 2, boxY + 162);

      ctx.restore();
    }

    function drawGameOverOverlay() {
      ctx.save();
      ctx.fillStyle = "rgba(4, 20, 18, 0.55)";
      ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

      const boxW = 290;
      const boxH = 172;
      const boxX = (WIDTH - boxW) / 2;
      const boxY = PLAY_HEIGHT * 0.27;

      ctx.fillStyle = "rgba(8, 36, 32, 0.92)";
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fde68a";
      ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("FLIGHT ENDED", WIDTH / 2, boxY + 32);

      ctx.fillStyle = "#ecfdf5";
      ctx.font = "bold 16px 'Trebuchet MS', sans-serif";
      ctx.fillText(`Level: ${score}   |   Best: ${bestScore}`, WIDTH / 2, boxY + 72);

      ctx.fillStyle = "#bbf7d0";
      ctx.font = "12px 'Trebuchet MS', sans-serif";
      ctx.fillText("Keep weaving through the realms!", WIDTH / 2, boxY + 102);

      ctx.fillStyle = "#4ade80";
      ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
      ctx.fillText("Press Space or Click to Retry", WIDTH / 2, boxY + 138);

      ctx.restore();
    }

    function render() {
      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake * 2;
        const sy = (Math.random() - 0.5) * screenShake * 2;
        ctx.translate(sx, sy);
      }

      drawBackground();
      drawCheckpointFlags();
      drawObstacles();
      drawPowerupOrbs();
      drawArrows();
      drawWindArcherCookie();
      drawGround();
      drawParticles();
      drawCheckpointBanner();
      drawHud();

      if (gameState === "start") {
        drawStartOverlay();
      } else if (gameState === "cutscene_100") {
        drawCutscene100();
      } else if (gameState === "cutscene_120") {
        drawCutscene120();
      } else if (gameState === "gameover") {
        drawGameOverOverlay();
      }

      ctx.restore();
    }

    function loop(now) {
      const dtMs = now - lastTime;
      lastTime = now;

      try {
        update(dtMs);
        render();
      } catch (err) {
        console.error(err);
      }

      requestAnimationFrame(loop);
    }

    function hitRect(px, py, rect) {
      if (!rect) return false;
      return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
    }

    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;

      if (gameState === "cutscene_100") {
        if (e.code === "KeyC" || e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          chooseContinueVolcano();
        } else if (e.code === "KeyG" || e.code === "Escape") {
          e.preventDefault();
          chooseGiveUp();
        }
        return;
      }

      if (gameState === "cutscene_120") {
        if (e.code === "KeyC" || e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          continueAfterFireSpirit();
        }
        return;
      }

      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        flap();
      } else if (e.code === "KeyF" || e.code === "ShiftLeft" || e.code === "ShiftRight") {
        e.preventDefault();
        shootWindArrow();
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;

      if (gameState === "cutscene_100") {
        if (hitRect(cx, cy, cutsceneButtons.continueBtn)) {
          chooseContinueVolcano();
        } else if (hitRect(cx, cy, cutsceneButtons.giveUpBtn)) {
          chooseGiveUp();
        }
        return;
      }

      if (gameState === "cutscene_120") {
        if (hitRect(cx, cy, cutsceneButtons.nextBtn)) {
          continueAfterFireSpirit();
        }
        return;
      }

      if (e.button === 2) {
        e.preventDefault();
        shootWindArrow();
        return;
      }
      if (e.button === 0) {
        flap();
      }
    });

    canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    windArrowBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      shootWindArrow();
    });

    resetRun();
    updateHudButton();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
