<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind Archer Cookie — Forest Vine Flight</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: radial-gradient(circle at top, #134e4a, #06181a 75%);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: #ecfdf5;
      user-select: none;
    }

    .game-shell {
      position: relative;
      border-radius: 16px;
      padding: 6px;
      background: linear-gradient(135deg, #4ade80, #15803d 45%, #86efac 100%);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65), 0 0 28px rgba(74, 222, 128, 0.25);
    }

    canvas {
      display: block;
      border-radius: 12px;
      background: #0b2623;
      cursor: pointer;
    }

    .hud-bar {
      width: 420px;
      max-width: 95vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(6, 28, 28, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.35);
      font-size: 13px;
    }

    .skill-btn {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid #86efac;
      background: linear-gradient(180deg, #22c55e, #15803d);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .skill-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .skill-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .skill-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      background: linear-gradient(180deg, #334155, #1e293b);
      border-color: #64748b;
    }

    .hints {
      color: #bbf7d0;
      font-size: 12px;
      text-align: right;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
  </div>

  <div class="hud-bar">
    <button id="windArrowBtn" class="skill-btn" type="button">
      Wind Arrow Ready [F]
    </button>
    <div class="hints">
      <div><strong>Flap:</strong> Space / Up / Click</div>
      <div><strong>Arrow (2x Smash):</strong> F / Shift / Right-Click</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const windArrowBtn = document.getElementById("windArrowBtn");

    // World & gameplay constants
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_HEIGHT = 86;
    const PLAY_HEIGHT = HEIGHT - GROUND_HEIGHT;

    const GRAVITY = 0.42;
    const FLAP_IMPULSE = -7.6;
    const BOOST_JUMP_IMPULSE = -9.8;
    const MAX_FALL_SPEED = 9.5;

    const OBSTACLE_WIDTH = 56;
    const OBSTACLE_GAP = 158;
    const BASE_OBSTACLE_SPEED = 2.55;
    const SUPER_SPEED_MULTIPLIER = 1.65;
    const SPAWN_INTERVAL_FRAMES = 98;

    // Wind Arrow settings: 4.0s cooldown, destroys up to 2 obstacles
    const ARROW_COOLDOWN_MS = 4000;
    const ARROW_SPEED = 11.5;
    const ARROW_MAX_DESTROYS = 2;

    // Power-up constants
    const POWERUP_DURATION_MS = 5000;
    const POWERUP_TYPES = ["strength", "speed", "noclip", "jump"];
    const POWERUP_META = {
      strength: {
        label: "SUPER STRENGTH",
        badge: "STR",
        color: "#ef4444",
        glow: "rgba(239, 68, 68, 0.45)",
        pillBg: "rgba(127, 29, 29, 0.85)",
        border: "#fca5a5"
      },
      speed: {
        label: "SUPER SPEED",
        badge: "SPD",
        color: "#f59e0b",
        glow: "rgba(245, 158, 11, 0.45)",
        pillBg: "rgba(120, 53, 15, 0.85)",
        border: "#fde68a"
      },
      noclip: {
        label: "NO-CLIP",
        badge: "GHOST",
        color: "#a855f7",
        glow: "rgba(168, 85, 247, 0.45)",
        pillBg: "rgba(76, 29, 149, 0.85)",
        border: "#e9d5ff"
      },
      jump: {
        label: "JUMP BOOST",
        badge: "JUMP",
        color: "#38bdf8",
        glow: "rgba(56, 189, 248, 0.45)",
        pillBg: "rgba(12, 74, 110, 0.85)",
        border: "#bae6fd"
      }
    };

    // Game state
    let gameState = "start"; // "start" | "playing" | "gameover"
    let score = 0;
    let bestScore = Number(localStorage.getItem("windArcherFlappyBest") || 0);
    let frames = 0;
    let lastTime = performance.now();
    let screenShake = 0;
    let shootAnimTimer = 0;

    // Cooldown & power-up state
    let arrowCooldownRemaining = 0;
    let activePowerup = { type: null, remainingMs: 0 };

    // Wind Archer Cookie + held companion bird
    const archer = {
      x: 112,
      y: PLAY_HEIGHT * 0.46,
      radius: 19,
      vy: 0,
      tilt: 0,
      scarfPhase: 0,
      birdWingPhase: 0,
      birdFlapBoost: 0
    };

    let obstacles = [];
    let powerupOrbs = [];
    let arrows = [];
    let particles = [];
    let windRibbons = [];

    // Rich multi-layer forest background data
    const farTrees = Array.from({ length: 14 }, (_, i) => ({
      x: i * 50 + ((i * 23) % 18),
      trunkW: 14 + (i % 3) * 5,
      canopyR: 46 + ((i * 19) % 28),
      yOffset: 75 + ((i * 29) % 75)
    }));

    const midTrees = Array.from({ length: 11 }, (_, i) => ({
      x: i * 62 + ((i * 31) % 22),
      trunkW: 20 + (i % 3) * 6,
      canopyR: 58 + ((i * 27) % 34),
      yOffset: 55 + ((i * 37) % 65),
      hasHangingVine: i % 2 === 0
    }));

    const nearTrees = Array.from({ length: 8 }, (_, i) => ({
      x: i * 86 + ((i * 43) % 26),
      trunkW: 26 + (i % 2) * 8,
      canopyR: 72 + ((i * 23) % 30)
    }));

    const canopyStrands = Array.from({ length: 15 }, (_, i) => ({
      x: i * 32 + ((i * 17) % 14),
      length: 34 + ((i * 29) % 58),
      phase: i * 0.65
    }));

    const ambientLeaves = Array.from({ length: 26 }, (_, i) => ({
      x: (i * 53) % WIDTH,
      y: (i * 71) % PLAY_HEIGHT,
      size: 3.5 + (i % 4) * 1.3,
      speedX: -0.95 - (i % 5) * 0.35,
      speedY: 0.45 + (i % 3) * 0.25,
      phase: i * 0.85,
      color: i % 3 === 0 ? "#4ade80" : i % 3 === 1 ? "#86efac" : "#bbf7d0"
    }));

    function getCurrentFlapImpulse() {
      return activePowerup.type === "jump" ? BOOST_JUMP_IMPULSE : FLAP_IMPULSE;
    }

    function getCurrentSpeedMultiplier() {
      return activePowerup.type === "speed" ? SUPER_SPEED_MULTIPLIER : 1.0;
    }

    function getCurrentObstacleSpeed() {
      return BASE_OBSTACLE_SPEED * getCurrentSpeedMultiplier();
    }

    function resetRun() {
      archer.x = 112;
      archer.y = PLAY_HEIGHT * 0.46;
      archer.vy = 0;
      archer.tilt = 0;
      archer.scarfPhase = 0;
      archer.birdWingPhase = 0;
      archer.birdFlapBoost = 0;

      obstacles = [];
      powerupOrbs = [];
      arrows = [];
      particles = [];
      windRibbons = [];

      score = 0;
      frames = 0;
      screenShake = 0;
      shootAnimTimer = 0;
      arrowCooldownRemaining = 0;
      activePowerup = { type: null, remainingMs: 0 };

      for (let i = 0; i < 4; i++) {
        windRibbons.push({
          x: Math.random() * WIDTH,
          y: 70 + Math.random() * (PLAY_HEIGHT - 140),
          len: 35 + Math.random() * 45,
          speed: 2.2 + Math.random() * 1.8,
          alpha: 0.16 + Math.random() * 0.16
        });
      }
    }

    function flap() {
      if (gameState === "start") {
        resetRun();
        gameState = "playing";
        archer.vy = getCurrentFlapImpulse();
        archer.birdFlapBoost = 1.0;
        spawnWindBurst(archer.x - 10, archer.y + 8, 8, "#86efac");
      } else if (gameState === "playing") {
        archer.vy = getCurrentFlapImpulse();
        archer.birdFlapBoost = 1.0;
        const burstColor = activePowerup.type === "jump" ? "#38bdf8" : "#bbf7d0";
        spawnWindBurst(archer.x - 12, archer.y + 8, 7, burstColor);
      } else if (gameState === "gameover") {
        resetRun();
        gameState = "playing";
        archer.vy = getCurrentFlapImpulse();
        archer.birdFlapBoost = 1.0;
      }
    }

    function shootWindArrow() {
      if (gameState !== "playing") return;
      if (arrowCooldownRemaining > 0) return;

      arrowCooldownRemaining = ARROW_COOLDOWN_MS;
      shootAnimTimer = 14;
      screenShake = Math.max(screenShake, 4.5);

      const bowTipX = archer.x + 27;
      const bowTipY = archer.y - 1;

      arrows.push({
        x: bowTipX,
        y: bowTipY,
        vx: ARROW_SPEED,
        vy: archer.vy * 0.08,
        angle: Math.atan2(archer.vy * 0.08, ARROW_SPEED),
        destroysLeft: ARROW_MAX_DESTROYS,
        hitIds: new Set(),
        trail: []
      });

      spawnWindBurst(bowTipX, bowTipY, 12, "#4ade80");
    }

    function spawnWindBurst(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.2 + Math.random() * 3.6;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd - 1.2,
          vy: Math.sin(ang) * spd,
          size: 2.5 + Math.random() * 3.5,
          life: 18 + Math.floor(Math.random() * 12),
          maxLife: 30,
          color,
          type: "spark"
        });
      }
    }

    function spawnObstacleDebris(x, y, w, h) {
      const palette = ["#4ade80", "#16a34a", "#15803d", "#a3e635", "#bbf7d0"];
      const count = 22;
      for (let i = 0; i < count; i++) {
        const px = x + Math.random() * w;
        const py = y + Math.random() * h;
        const ang = -Math.PI * 0.85 + Math.random() * Math.PI * 0.7;
        const spd = 2.2 + Math.random() * 5.2;
        particles.push({
          x: px,
          y: py,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.5,
          w: 5 + Math.random() * 7,
          h: 4 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: -0.25 + Math.random() * 0.5,
          life: 28 + Math.floor(Math.random() * 14),
          maxLife: 42,
          color: palette[i % palette.length],
          type: "chunk"
        });
      }
    }

    let nextObstacleId = 1;
    function spawnObstaclePair() {
      const minTop = 54;
      const maxTop = PLAY_HEIGHT - OBSTACLE_GAP - 54;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
      const bottomY = topHeight + OBSTACLE_GAP;

      obstacles.push({
        id: nextObstacleId++,
        x: WIDTH + 10,
        topHeight,
        bottomY,
        topDestroyed: false,
        bottomDestroyed: false,
        passed: false,
        swayPhase: Math.random() * Math.PI * 2
      });

      if (nextObstacleId % 2 === 1) {
        const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
        powerupOrbs.push({
          x: WIDTH + 10 + OBSTACLE_WIDTH * 0.5,
          y: topHeight + OBSTACLE_GAP * 0.5,
          radius: 15,
          type,
          bobPhase: Math.random() * Math.PI * 2
        });
      }
    }

    function circleIntersectsRect(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < cr * cr;
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
      const steps = 6;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        if (px >= rx - 8 && px <= rx + rw + 8 && py >= ry - 8 && py <= ry + rh + 8) {
          return true;
        }
      }
      return false;
    }

    function triggerGameOver() {
      if (gameState === "gameover") return;
      gameState = "gameover";
      activePowerup = { type: null, remainingMs: 0 };
      screenShake = 8;
      spawnWindBurst(archer.x, archer.y, 18, "#86efac");
    }

    function updateHudButton() {
      if (gameState !== "playing") {
        windArrowBtn.disabled = true;
        windArrowBtn.textContent = "Wind Arrow Ready [F]";
        return;
      }

      if (arrowCooldownRemaining > 0) {
        windArrowBtn.disabled = true;
        const sec = (arrowCooldownRemaining / 1000).toFixed(1);
        windArrowBtn.textContent = `Wind Arrow (${sec}s)`;
      } else {
        windArrowBtn.disabled = false;
        windArrowBtn.textContent = "Wind Arrow Ready [F]";
      }
    }

    function update(dtMs) {
      const dtScale = Math.min(2.0, dtMs / (1000 / 60));

      const baseEnvMult = gameState === "playing" ? 1.0 : 0.45;
      const speedMult = gameState === "playing" ? baseEnvMult * getCurrentSpeedMultiplier() : baseEnvMult;

      for (const leaf of ambientLeaves) {
        leaf.x += leaf.speedX * speedMult * dtScale;
        leaf.y += (leaf.speedY + Math.sin(frames * 0.04 + leaf.phase) * 0.35) * dtScale;
        if (leaf.x < -12) {
          leaf.x = WIDTH + 12;
          leaf.y = Math.random() * PLAY_HEIGHT;
        }
        if (leaf.y > PLAY_HEIGHT - 6) {
          leaf.y = 0;
        }
      }

      for (const rib of windRibbons) {
        rib.x -= rib.speed * speedMult * dtScale;
        if (rib.x + rib.len < 0) {
          rib.x = WIDTH + 20;
          rib.y = 55 + Math.random() * (PLAY_HEIGHT - 120);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dtScale;
        p.y += p.vy * dtScale;
        if (p.type === "chunk") {
          p.vy += 0.24 * dtScale;
          p.rot += p.vRot * dtScale;
        }
        p.life -= dtScale;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      if (screenShake > 0) {
        screenShake *= Math.pow(0.84, dtScale);
        if (screenShake < 0.2) screenShake = 0;
      }

      if (shootAnimTimer > 0) {
        shootAnimTimer = Math.max(0, shootAnimTimer - dtScale);
      }

      if (gameState === "start") {
        frames += dtScale;
        archer.y = PLAY_HEIGHT * 0.46 + Math.sin(frames * 0.07) * 8;
        archer.tilt = Math.sin(frames * 0.07) * 0.08;
        archer.scarfPhase += 0.16 * dtScale;
        archer.birdWingPhase += 0.22 * dtScale;
        updateHudButton();
        return;
      }

      if (gameState !== "playing") {
        updateHudButton();
        return;
      }

      frames += dtScale;

      if (arrowCooldownRemaining > 0) {
        arrowCooldownRemaining = Math.max(0, arrowCooldownRemaining - dtMs);
      }

      if (activePowerup.type) {
        activePowerup.remainingMs = Math.max(0, activePowerup.remainingMs - dtMs);
        if (activePowerup.remainingMs <= 0) {
          activePowerup = { type: null, remainingMs: 0 };
        }
      }

      updateHudButton();

      archer.vy = Math.min(MAX_FALL_SPEED + (activePowerup.type === "jump" ? 1.5 : 0), archer.vy + GRAVITY * dtScale);
      archer.y += archer.vy * dtScale;
      archer.tilt = Math.max(-0.45, Math.min(Math.PI * 0.44, archer.vy * 0.068));
      archer.scarfPhase += (activePowerup.type === "speed" ? 0.38 : 0.24) * dtScale;

      if (archer.birdFlapBoost > 0) {
        archer.birdFlapBoost = Math.max(0, archer.birdFlapBoost - 0.05 * dtScale);
        archer.birdWingPhase += 0.55 * dtScale;
      } else {
        archer.birdWingPhase += 0.18 * dtScale;
      }

      if (archer.y - archer.radius < 4) {
        archer.y = 4 + archer.radius;
        if (archer.vy < 0) archer.vy = 0;
      }

      if (archer.y + archer.radius >= PLAY_HEIGHT) {
        archer.y = PLAY_HEIGHT - archer.radius;
        triggerGameOver();
        return;
      }

      if (Math.floor(frames) % SPAWN_INTERVAL_FRAMES === 0 && frames - Math.floor(frames) < dtScale) {
        spawnObstaclePair();
      }

      const obstacleSpeed = getCurrentObstacleSpeed();

      for (let i = powerupOrbs.length - 1; i >= 0; i--) {
        const orb = powerupOrbs[i];
        orb.x -= obstacleSpeed * dtScale;
        orb.bobPhase += 0.08 * dtScale;
        const bobY = orb.y + Math.sin(orb.bobPhase) * 6;

        const dx = archer.x - orb.x;
        const dy = archer.y - bobY;
        if (dx * dx + dy * dy <= (archer.radius + orb.radius) ** 2) {
          activePowerup = { type: orb.type, remainingMs: POWERUP_DURATION_MS };
          const meta = POWERUP_META[orb.type];
          screenShake = Math.max(screenShake, 4);
          spawnWindBurst(orb.x, bobY, 16, meta.color);
          powerupOrbs.splice(i, 1);
          continue;
        }

        if (orb.x < -40) {
          powerupOrbs.splice(i, 1);
        }
      }

      for (let i = arrows.length - 1; i >= 0; i--) {
        const ar = arrows[i];
        ar.trail.push({ x: ar.x, y: ar.y });
        if (ar.trail.length > 9) ar.trail.shift();

        const prevX = ar.x;
        const prevY = ar.y;
        ar.x += ar.vx * dtScale;
        ar.y += ar.vy * dtScale;

        if (Math.random() < 0.65) {
          particles.push({
            x: ar.x - 8,
            y: ar.y + (Math.random() - 0.5) * 6,
            vx: -2.2 - Math.random() * 1.5,
            vy: (Math.random() - 0.5) * 1.4,
            size: 2.2 + Math.random() * 2.5,
            life: 12,
            maxLife: 12,
            color: "#86efac",
            type: "spark"
          });
        }

        for (const obs of obstacles) {
          if (ar.destroysLeft <= 0) break;

          const topKey = `${obs.id}-top`;
          if (
            !obs.topDestroyed &&
            obs.topHeight > 0 &&
            !ar.hitIds.has(topKey) &&
            segmentIntersectsRect(prevX, prevY, ar.x, ar.y, obs.x, 0, OBSTACLE_WIDTH, obs.topHeight)
          ) {
            obs.topDestroyed = true;
            ar.hitIds.add(topKey);
            ar.destroysLeft--;
            screenShake = Math.max(screenShake, 5.5);
            spawnObstacleDebris(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight);
            spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, obs.topHeight, 12, "#4ade80");
            if (ar.destroysLeft <= 0) break;
          }

          const botKey = `${obs.id}-bot`;
          const botHeight = PLAY_HEIGHT - obs.bottomY;
          if (
            !obs.bottomDestroyed &&
            botHeight > 0 &&
            !ar.hitIds.has(botKey) &&
            segmentIntersectsRect(prevX, prevY, ar.x, ar.y, obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight)
          ) {
            obs.bottomDestroyed = true;
            ar.hitIds.add(botKey);
            ar.destroysLeft--;
            screenShake = Math.max(screenShake, 5.5);
            spawnObstacleDebris(obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight);
            spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, obs.bottomY, 12, "#4ade80");
            if (ar.destroysLeft <= 0) break;
          }
        }

        if (ar.destroysLeft <= 0 || ar.x > WIDTH + 50 || ar.y < -30 || ar.y > PLAY_HEIGHT + 30) {
          arrows.splice(i, 1);
        }
      }

      const hasSuperStrength = activePowerup.type === "strength";
      const hasNoClip = activePowerup.type === "noclip";

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= obstacleSpeed * dtScale;
        obs.swayPhase += 0.05 * dtScale;

        const botHeight = PLAY_HEIGHT - obs.bottomY;

        if (!hasNoClip) {
          const hitTop =
            !obs.topDestroyed &&
            circleIntersectsRect(archer.x, archer.y, archer.radius - 2, obs.x, 0, OBSTACLE_WIDTH, obs.topHeight);
          const hitBottom =
            !obs.bottomDestroyed &&
            circleIntersectsRect(archer.x, archer.y, archer.radius - 2, obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight);

          if (hitTop) {
            if (hasSuperStrength) {
              obs.topDestroyed = true;
              screenShake = Math.max(screenShake, 6.5);
              spawnObstacleDebris(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight);
              spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, Math.min(archer.y, obs.topHeight), 14, "#ef4444");
            } else {
              triggerGameOver();
              return;
            }
          }

          if (hitBottom) {
            if (hasSuperStrength) {
              obs.bottomDestroyed = true;
              screenShake = Math.max(screenShake, 6.5);
              spawnObstacleDebris(obs.x, obs.bottomY, OBSTACLE_WIDTH, botHeight);
              spawnWindBurst(obs.x + OBSTACLE_WIDTH / 2, Math.max(archer.y, obs.bottomY), 14, "#ef4444");
            } else {
              triggerGameOver();
              return;
            }
          }
        }

        if (!obs.passed && obs.x + OBSTACLE_WIDTH < archer.x) {
          obs.passed = true;
          score++;
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem("windArcherFlappyBest", String(bestScore));
          }
        }

        if (obs.x + OBSTACLE_WIDTH < -40) {
          obstacles.splice(i, 1);
        }
      }
    }

    // ---------------- RENDERING ----------------

    function drawBackground() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_HEIGHT);
      skyGrad.addColorStop(0, "#071d1a");
      skyGrad.addColorStop(0.45, "#0f3b32");
      skyGrad.addColorStop(1, "#185343");

        beamGrad.addColorStop(1, "rgba(74, 222, 128, 0)");

        ctx.beginPath();
        ctx.moveTo(bx - 24, 0);
        ctx.lineTo(bx + 28, 0);
        ctx.lineTo(bx + 125, PLAY_HEIGHT);
        ctx.lineTo(bx + 35, PLAY_HEIGHT);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = "#0a2a24";
      ctx.beginPath();
      ctx.moveTo(0, PLAY_HEIGHT);
      ctx.quadraticCurveTo(95, PLAY_HEIGHT - 190, 210, PLAY_HEIGHT - 140);
      ctx.quadraticCurveTo(320, PLAY_HEIGHT - 215, WIDTH, PLAY_HEIGHT - 150);
      ctx.lineTo(WIDTH, PLAY_HEIGHT);
      ctx.closePath();
      ctx.fill();

      const envMult = gameState === "playing" ? getCurrentSpeedMultiplier() : 0.45;
      const farScroll = gameState === "playing" ? frames * 0.35 * envMult : frames * 0.12;
      const farSpan = 700;
      for (const t of farTrees) {
        const sx = (((t.x - farScroll) % farSpan) + farSpan) % farSpan - 80;

        ctx.fillRect(sx - t.trunkW / 2, crownY, t.trunkW, PLAY_HEIGHT - crownY);

        ctx.beginPath();
        ctx.arc(sx, crownY, t.canopyR, 0, Math.PI * 2);
        ctx.arc(sx - t.canopyR * 0.55, crownY + 12, t.canopyR * 0.72, 0, Math.PI * 2);
        ctx.arc(sx + t.canopyR * 0.55, crownY + 10, t.canopyR * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }

      const midScroll = gameState === "playing" ? frames * 0.75 * envMult : frames * 0.25;
      const midSpan = 682;
      for (const t of midTrees) {
        const sx = (((t.x - midScroll) % midSpan) + midSpan) % midSpan - 90;
        if (sx < -100 || sx > WIDTH + 100) continue;

        const crownY = PLAY_HEIGHT - t.yOffset - 105;
        ctx.fillStyle = "#132920";
        ctx.fillRect(sx - t.trunkW / 2, crownY, t.trunkW, PLAY_HEIGHT - crownY);

        ctx.fillStyle = "#1e3c2f";
        ctx.fillRect(sx - t.trunkW * 0.25, crownY + 8, t.trunkW * 0.22, PLAY_HEIGHT - crownY - 8);

        ctx.fillStyle = "#0f4234";
        ctx.beginPath();
        ctx.arc(sx, crownY, t.canopyR, 0, Math.PI * 2);
        ctx.arc(sx - t.canopyR * 0.6, crownY + 14, t.canopyR * 0.76, 0, Math.PI * 2);
        ctx.arc(sx + t.canopyR * 0.6, crownY + 12, t.canopyR * 0.78, 0, Math.PI * 2);

        if (t.hasHangingVine) {
          const sway = Math.sin(frames * 0.04 + t.x * 0.05) * 5;
          ctx.strokeStyle = "#15803d";
          ctx.lineWidth = 2.2;
          ctx.beginPath();

          ctx.quadraticCurveTo(sx + 22 + sway, crownY + 80, sx + 16 + sway * 1.3, crownY + 135);
          ctx.stroke();

      }

      for (const rib of windRibbons) {
        ctx.save();

        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(rib.x, rib.y);

      if (gameState === "playing" && activePowerup.type === "speed") {
        ctx.save();

        for (let s = 0; s < 7; s++) {

      const nearScroll = gameState === "playing" ? frames * 1.15 * envMult : frames * 0.35;

        ctx.beginPath();
        ctx.ellipse(sx + sway, st.length, 4.5, 2.2, sway * 0.08, 0, Math.PI * 2);

      ctx.fillStyle = "#082921";
      for (let cx = -30; cx <= WIDTH + 30; cx += 44) {

      for (const leaf of ambientLeaves) {

    function drawVineObstacle(x, y, w, h, isTop, swayPhase) {
      if (h <= 0) return;

      const centerX = x + w * 0.5;
      const stepY = 14;

      const strands = [
        { offset: -w * 0.22, width: w * 0.44, color: "#15803d", phaseShift: 0 },
        { offset: w * 0.22, width: w * 0.44, color: "#166534", phaseShift: Math.PI }
      ];

      ctx.save();
      if (activePowerup.type === "noclip") {
        ctx.globalAlpha = 0.48;
      }

      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = w * 0.56;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let py = y; py <= y + h; py += stepY) {
        const wave = Math.sin(py * 0.045 + swayPhase) * 5;
        if (py === y) ctx.moveTo(centerX + wave, py);
        else ctx.lineTo(centerX + wave, py);
      }
      ctx.lineTo(centerX + Math.sin((y + h) * 0.045 + swayPhase) * 5, y + h);
      ctx.stroke();

      for (const st of strands) {
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = st.width + 3;
        ctx.beginPath();
        for (let py = y; py <= y + h; py += 8) {
          const coil = centerX + Math.sin(py * 0.075 + swayPhase + st.phaseShift) * (w * 0.26);
          if (py === y) ctx.moveTo(coil, py);
          else ctx.lineTo(coil, py);
        }
        ctx.stroke();

        ctx.strokeStyle = st.color;
        ctx.lineWidth = st.width;
        ctx.beginPath();
        for (let py = y; py <= y + h; py += 8) {
          const coil = centerX + Math.sin(py * 0.075 + swayPhase + st.phaseShift) * (w * 0.26);
          if (py === y) ctx.moveTo(coil, py);
          else ctx.lineTo(coil, py);
        }
        ctx.stroke();
      }

      for (let ly = y + 18; ly < y + h - 14; ly += 22) {
        const idx = Math.floor((ly - y) / 22);
        const side = idx % 2 === 0 ? -1 : 1;
        const spineX = centerX + Math.sin(ly * 0.075 + swayPhase) * (w * 0.24);
        const leafX = spineX + side * (w * 0.42);
        const leafY = ly + Math.sin(swayPhase + idx) * 2;

        ctx.fillStyle = idx % 3 === 0 ? "#22c55e" : "#16a34a";
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(leafX, leafY, 10, 5, side * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "#bbf7d0";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(spineX, leafY);
        ctx.lineTo(leafX + side * 5, leafY);
        ctx.stroke();
      }

      const tipY = isTop ? y + h - 6 : y + 6;
      const tipSway = Math.sin(tipY * 0.075 + swayPhase) * 4;
      const tipX = centerX + tipSway;

      ctx.fillStyle = "#15803d";
      ctx.strokeStyle = "#052e16";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.roundRect(x - 3, isTop ? y + h - 18 : y, w + 6, 18, 8);
      ctx.fill();
      ctx.stroke();

      const tipLeaves = [
        { dx: -w * 0.52, dy: isTop ? 4 : -4, ang: isTop ? 0.55 : -0.55, col: "#4ade80" },
        { dx: w * 0.52, dy: isTop ? 4 : -4, ang: isTop ? -0.55 : 0.55, col: "#22c55e" },
        { dx: -w * 0.25, dy: isTop ? 9 : -9, ang: isTop ? 0.85 : -0.85, col: "#86efac" },
        { dx: w * 0.25, dy: isTop ? 9 : -9, ang: isTop ? -0.85 : 0.85, col: "#4ade80" }
      ];

      for (const tl of tipLeaves) {
        ctx.fillStyle = tl.col;
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(tipX + tl.dx, tipY + tl.dy, 11, 5.5, tl.ang, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawWindArcherCookie() {
      ctx.save();
      ctx.translate(archer.x, archer.y);

      if (activePowerup.type) {
        const meta = POWERUP_META[activePowerup.type];
        const pulseR = 35 + Math.sin(frames * 0.25) * 3;
        const pGrad = ctx.createRadialGradient(0, 0, 8, 0, 0, pulseR);

        ctx.beginPath();
        ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
        ctx.fill();

        if (activePowerup.type === "strength") {

        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, Math.PI * 2);

      if (activePowerup.type === "noclip") {
        ctx.globalAlpha = 0.65;
      }

      ctx.rotate(archer.tilt);

      const w1 = Math.sin(archer.scarfPhase) * 6.5;
      const w2 = Math.cos(archer.scarfPhase + 1.0) * 7.5;
      const w3 = Math.sin(archer.scarfPhase + 2.1) * 6;

      // Flowing emerald wind scarf tail billowing behind
      ctx.fillStyle = "#15803d";
      ctx.strokeStyle = "#052e16";
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(-8, -2);
      ctx.quadraticCurveTo(-22, -11 + w1, -39, -3 + w2);
      ctx.quadraticCurveTo(-26, 6 + w1, -9, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#4ade80";
      ctx.beginPath();
      ctx.moveTo(-9, 2);
      ctx.quadraticCurveTo(-22, 6 - w1, -35, 13 - w2);
      ctx.quadraticCurveTo(-22, 12 - w1, -8, 5);

      ctx.fill();

      // Slender quiver with leaf-fletched arrows on back
      ctx.save();
      ctx.translate(-7, 2);

      for (const aOff of [-2.5, 1, 4.5]) {

        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(aOff, -9);

        ctx.stroke();

        ctx.fillStyle = "#86efac";
        ctx.beginPath();
        ctx.ellipse(aOff - 2.2, -17, 3.2, 1.6, -0.5, 0, Math.PI * 2);
        ctx.ellipse(aOff + 2.2, -17, 3.2, 1.6, 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#7c3f1d";
      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 1.9;
      ctx.beginPath();
      ctx.roundRect(-5, -10, 11, 20, 3.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#166534";
      ctx.fillRect(-4.2, -3.5, 9.4, 4.5);
      ctx.restore();

      // Slim, agile cookie legs / boots
      ctx.fillStyle = "#a3e635";
      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 1.9;
      ctx.beginPath();
      ctx.roundRect(-4.5, 12.5, 4.6, 8.5, 2.3);
      ctx.roundRect(2.8, 12.5, 4.6, 8.5, 2.3);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#166534";
      ctx.fillRect(-4.5, 12.5, 4.6, 3.8);
      ctx.fillRect(2.8, 12.5, 4.6, 3.8);

      // Slimmer cookie torso & dark belt
      const tunicGrad = ctx.createLinearGradient(-9, -4, 9, 15);
      tunicGrad.addColorStop(0, "#84cc16");
      tunicGrad.addColorStop(1, "#3f6212");

      ctx.fillStyle = tunicGrad;
      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 2.1;
      ctx.beginPath();
      ctx.roundRect(-8.5, -3.5, 17, 17.5, 6.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(-8.5, 6.5, 17, 3.6);
      ctx.fillStyle = "#4ade80";
      ctx.fillRect(-1.8, 6.5, 3.6, 3.6);

      // Flowing, wind-swept layered leaf hair (sweeping back & trailing in breeze)
      const flowingLocks = [
        {
          fill: "#14532d",
          d: [
            [-8, -14],
            [-24, -18 + w1 * 0.7],
            [-40, -11 + w2 * 0.85],
            [-26, -6 + w1 * 0.6],
            [-8, -8]
          ]
        },
        {
          fill: "#15803d",
          d: [
            [-7, -18],
            [-23, -27 + w2 * 0.75],
            [-42, -21 + w3 * 0.9],
            [-25, -14 + w2 * 0.65],
            [-6, -12]
          ]
        },
        {
          fill: "#65a30d",
          d: [
            [-5, -21],
            [-19, -34 + w3 * 0.8],
            [-36, -30 + w1 * 0.9],
            [-18, -23 + w3 * 0.65],
            [-2, -18]
          ]
        },
        {
          fill: "#84cc16",
          d: [
            [1, -23],
            [-9, -35 + w1 * 0.75],
            [-23, -34 + w2 * 0.85],
            [-7, -25 + w1 * 0.6],
            [6, -21]
          ]
        }
      ];

      for (const lock of flowingLocks) {
        ctx.fillStyle = lock.fill;
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 1.6;
        ctx.lineJoin = "round";
        ctx.beginPath();
        lock.d.forEach(([px, py], idx) => {
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Slimmer cookie head
      ctx.fillStyle = "#d9e29c";
      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 2.1;
      ctx.beginPath();
      ctx.arc(1, -10, 12.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Swept-back side & crown leaf locks framing the head
      ctx.fillStyle = "#84cc16";
      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(4, -22);
      ctx.quadraticCurveTo(13, -27 + w2 * 0.45, 19, -20 + w1 * 0.55);
      ctx.quadraticCurveTo(12, -16, 7, -19);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Front swooping leaf bangs across forehead
      ctx.fillStyle = "#a3e635";
      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-10.5, -13);
      ctx.quadraticCurveTo(-3, -20.5, 5.5, -15.5);
      ctx.quadraticCurveTo(-1.5, -11.5, -10.5, -13);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Glowing emerald diamond gem on forehead
      ctx.save();
      ctx.translate(2.5, -17.5);
      ctx.fillStyle = "#22c55e";
      ctx.strokeStyle = "#064e3b";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, -4.8);
      ctx.lineTo(3.7, 0);
      ctx.lineTo(0, 4.8);
      ctx.lineTo(-3.7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#dcfce7";
      ctx.beginPath();
      ctx.moveTo(0, -3.0);
      ctx.lineTo(1.6, -0.4);
      ctx.lineTo(0, 1.3);
      ctx.lineTo(-1.6, -0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Expressive emerald-green eyes + thick cream-white CRK eyebrows
      ctx.fillStyle = "#16a34a";
      ctx.beginPath();
      ctx.arc(6.2, -8.5, 2.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#052e16";
      ctx.beginPath();
      ctx.arc(6.8, -8.5, 1.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(7.4, -9.7, 1.0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#fefce8";
      ctx.lineWidth = 2.9;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(2.5, -12.3);
      ctx.quadraticCurveTo(7.2, -14.6, 10.8, -11.4);
      ctx.stroke();

      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(7.2, -4.8);
      ctx.lineTo(9.8, -4.8);
      ctx.stroke();

      // Wrapped dark-emerald forest scarf around neck
      ctx.fillStyle = "#166534";
      ctx.strokeStyle = "#052e16";
      ctx.lineWidth = 1.9;
      ctx.beginPath();
      ctx.roundRect(-10, -2.5, 19.5, 6.8, 3.4);
      ctx.fill();
      ctx.stroke();

      // Outstretched arm holding the companion bird
      ctx.strokeStyle = "#d9e29c";
      ctx.lineWidth = 4.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(3.5, 4.5);
      ctx.lineTo(12.5, 5.5);
      ctx.stroke();

      ctx.strokeStyle = "#2b1408";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(3.5, 4.5);
      ctx.lineTo(12.5, 5.5);
      ctx.stroke();

      drawCompanionBird();

      // Curved vine-and-clover bow
      const recoil = shootAnimTimer > 0 ? -3.5 * (shootAnimTimer / 14) : 0;
      ctx.save();
      ctx.translate(16 + recoil, -1);

      ctx.strokeStyle = "rgba(220, 252, 231, 0.85)";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(2, -17);
      ctx.lineTo(shootAnimTimer > 0 ? -4 : 5, 0);
      ctx.lineTo(2, 17);
      ctx.stroke();

      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(-5, 0, 17, -0.85, 0.85);
      ctx.stroke();

      ctx.strokeStyle = "#14532d";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(-5, 0, 17, -0.85, 0.85);
      ctx.stroke();

      for (const ang of [-0.55, 0.55]) {
        const bx = -5 + Math.cos(ang) * 17;
        const by = Math.sin(ang) * 17;
        ctx.fillStyle = "#86efac";
        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = 1;
        for (let l = 0; l < 4; l++) {
          const la = (l * Math.PI) / 2;
          ctx.beginPath();
          ctx.arc(bx + Math.cos(la) * 2.1, by + Math.sin(la) * 2.1, 2.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.restore();
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        if (p.type === "chunk") {
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawOverlayUI() {
      ctx.save();
      ctx.fillStyle = "rgba(6, 24, 24, 0.65)";
      ctx.beginPath();
      ctx.roundRect(14, 14, 152, 54, 10);
      ctx.fill();
      ctx.strokeStyle = "rgba(134, 239, 172, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ecfdf5";
      ctx.font = "bold 22px system-ui, sans-serif";
      ctx.fillText(`Score: ${score}`, 26, 40);

      ctx.fillStyle = "#bbf7d0";
      ctx.font = "600 12px system-ui, sans-serif";
      ctx.fillText(`Best: ${bestScore}`, 26, 58);

      const ready = arrowCooldownRemaining <= 0;
      ctx.fillStyle = ready ? "rgba(34, 197, 94, 0.25)" : "rgba(15, 23, 42, 0.72)";
      ctx.beginPath();
      ctx.roundRect(WIDTH - 154, 14, 140, 42, 10);
      ctx.fill();
      ctx.strokeStyle = ready ? "#4ade80" : "#64748b";
      ctx.stroke();

      ctx.fillStyle = ready ? "#86efac" : "#cbd5e1";
      ctx.font = "bold 12px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(
        ready ? "WIND ARROW: READY" : `ARROW CD: ${(arrowCooldownRemaining / 1000).toFixed(1)}s`,
        WIDTH - 84,
        39
      );

      if (activePowerup.type && gameState === "playing") {
        const meta = POWERUP_META[activePowerup.type];
        const secLeft = (activePowerup.remainingMs / 1000).toFixed(1);
        const ratio = Math.max(0, Math.min(1, activePowerup.remainingMs / POWERUP_DURATION_MS));

        ctx.fillStyle = meta.pillBg;
        ctx.beginPath();
        ctx.roundRect(WIDTH - 174, 64, 160, 34, 9);
        ctx.fill();
        ctx.strokeStyle = meta.border;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${meta.label} (${secLeft}s)`, WIDTH - 164, 78);

        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(WIDTH - 164, 84, 140, 6);
        ctx.fillStyle = meta.border;
        ctx.fillRect(WIDTH - 164, 84, 140 * ratio, 6);
      }

      ctx.restore();

      if (gameState === "start") {
        ctx.save();
        ctx.fillStyle = "rgba(4, 18, 18, 0.55)";
        ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

        ctx.textAlign = "center";
        ctx.fillStyle = "#86efac";
        ctx.font = "bold 26px system-ui, sans-serif";
        ctx.fillText("WIND ARCHER COOKIE", WIDTH / 2, PLAY_HEIGHT * 0.21);

        ctx.fillStyle = "#ecfdf5";
        ctx.font = "600 13.5px system-ui, sans-serif";
        ctx.fillText("Weave through forest vines & shoot Gale Arrows", WIDTH / 2, PLAY_HEIGHT * 0.21 + 25);

        ctx.fillStyle = "#fde68a";
        ctx.font = "bold 12px system-ui, sans-serif";
        ctx.fillText("Power-Ups: Super Strength • Super Speed • No-Clip • Jump Boost", WIDTH / 2, PLAY_HEIGHT * 0.72);

        ctx.fillStyle = "#bbf7d0";
        ctx.font = "600 12px system-ui, sans-serif";
        ctx.fillText("Wind Arrow: 4s Cooldown • Destroys up to 2 Vines", WIDTH / 2, PLAY_HEIGHT * 0.72 + 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px system-ui, sans-serif";
        ctx.fillText("Click or Press SPACE to Fly", WIDTH / 2, PLAY_HEIGHT * 0.72 + 44);
        ctx.restore();
      } else if (gameState === "gameover") {
        ctx.save();
        ctx.fillStyle = "rgba(4, 14, 16, 0.68)";
        ctx.fillRect(0, 0, WIDTH, PLAY_HEIGHT);

        const boxW = 300;
        const boxH = 186;
        const bx = (WIDTH - boxW) / 2;
        const by = (PLAY_HEIGHT - boxH) / 2;

        ctx.fillStyle = "rgba(9, 36, 36, 0.94)";
        ctx.beginPath();
        ctx.roundRect(bx, by, boxW, boxH, 14);
        ctx.fill();
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#fda4af";
        ctx.font = "bold 24px system-ui, sans-serif";
        ctx.fillText("GALE INTERRUPTED", WIDTH / 2, by + 44);

        ctx.fillStyle = "#ecfdf5";
        ctx.font = "bold 18px system-ui, sans-serif";
        ctx.fillText(`Score: ${score}   |   Best: ${bestScore}`, WIDTH / 2, by + 84);

        ctx.fillStyle = "#86efac";
        ctx.font = "600 13px system-ui, sans-serif";
        ctx.fillText("Press SPACE or Click to Fly Again", WIDTH / 2, by + 132);
        ctx.restore();
      }
    }

    function render() {
      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake * 1.8;
        const sy = (Math.random() - 0.5) * screenShake * 1.8;
        ctx.translate(sx, sy);
      }

      drawBackground();
      drawObstacles();
      drawPowerupOrbs();
      drawGround();
      drawWindArrows();
      drawWindArcherCookie();
      drawParticles();
      drawOverlayUI();

      ctx.restore();
    }

    function loop(now) {
      const dtMs = now - lastTime;
      lastTime = now;

      update(dtMs);
      render();

      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        flap();
      } else if (e.code === "KeyF" || e.code === "ShiftLeft" || e.code === "ShiftRight") {
        e.preventDefault();
        shootWindArrow();
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (e.button === 2) {
        e.preventDefault();
        shootWindArrow();
      } else {
        flap();
      }
    });

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    windArrowBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      shootWindArrow();
    });

    resetRun();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
